const GLOSSARY = {
  "Kubernetes":"An open-source container orchestration platform originally built by Google. Automates deployment, scaling, and management of containerized applications across clusters of machines.",
  "K8s":"Short for Kubernetes — 8 letters between K and s. The industry-standard abbreviation.",
  "cluster":"A set of machines (nodes) that run containerized applications managed by Kubernetes. Every cluster has a control plane and one or more worker nodes.",
  "node":"A physical or virtual machine in a Kubernetes cluster. Worker nodes run Pods; control plane nodes run system components like the API Server and etcd.",
  "Pod":"The smallest deployable unit in Kubernetes. Wraps one or more containers sharing the same network namespace, storage, and lifecycle.",
  "container":"A lightweight, standalone executable package that includes code, runtime, libraries, and settings. Containers share the host OS kernel but are isolated from each other.",
  "image":"A read-only template used to create containers. Built from a Dockerfile and stored in a container registry (Docker Hub, ECR, GCR).",
  "registry":"A storage and distribution system for container images. Examples: Docker Hub, AWS ECR, Google Artifact Registry.",
  "Namespace":"A virtual cluster inside a physical K8s cluster. Used to isolate resources by team, environment, or project.",
  "Deployment":"A controller that manages a ReplicaSet, keeping a specified number of identical Pods running. Handles rolling updates and rollbacks automatically.",
  "ReplicaSet":"Ensures a specified number of Pod replicas are always running. If a Pod dies, it creates a new one. Managed by a Deployment.",
  "Service":"A stable network endpoint (virtual IP + DNS name) routing traffic to a dynamic set of Pods. Solves the ephemeral Pod IP problem.",
  "ClusterIP":"The default Service type. Creates a virtual IP only reachable inside the cluster. For internal microservice communication.",
  "NodePort":"A Service type that opens a port (30000–32767) on every node. Allows external access. Used for dev/testing.",
  "LoadBalancer":"A Service type that provisions a cloud load balancer (AWS ELB, GCP LB). For production public-facing services.",
  "ExternalName":"A Service type that maps to an external DNS name. For integrating outside services into cluster DNS.",
  "ConfigMap":"A K8s object storing non-sensitive configuration as key-value pairs. Injected as env vars or mounted as files. Decouples config from images.",
  "Secret":"Like a ConfigMap but for sensitive data. Values are base64-encoded — NOT encrypted by default.",
  "PersistentVolume":"A cluster-level storage resource. Exists independently of any Pod. Created by admins or auto-provisioned via StorageClass.",
  "PersistentVolumeClaim":"A Pod's request for storage. K8s finds a matching PV and binds it. The Pod mounts the PVC as a volume.",
  "StorageClass":"Defines a type of storage and its provisioner. Enables dynamic provisioning of PVs.",
  "RBAC":"Role-Based Access Control. Controls who can do what on which resources in K8s.",
  "Role":"An RBAC object granting permissions within a single namespace.",
  "ClusterRole":"Like a Role but cluster-wide. Can grant access to non-namespaced resources like nodes.",
  "RoleBinding":"Connects a Role to a subject (user, group, or ServiceAccount) within a namespace.",
  "ServiceAccount":"A machine identity for Pods when calling the K8s API. Auto-mounted at /var/run/secrets/kubernetes.io/serviceaccount/token.",
  "HPA":"Horizontal Pod Autoscaler. Automatically adjusts Pod replicas based on CPU, memory, or custom metrics.",
  "Ingress":"An API object defining HTTP/HTTPS routing rules into Services. Requires an Ingress Controller to process the rules.",
  "Ingress Controller":"The running component (nginx, Traefik, HAProxy) that reads Ingress objects and configures a reverse proxy.",
  "livenessProbe":"A health check — failure causes K8s to KILL AND RESTART the container. For detecting deadlocks.",
  "readinessProbe":"A health check — failure removes the Pod from Service endpoints WITHOUT restarting it.",
  "startupProbe":"A health check that runs only during startup. Disables liveness/readiness while failing. For slow-starting apps.",
  "Resource Request":"The GUARANTEED minimum CPU/memory a container needs. The Scheduler uses this for placement.",
  "Resource Limit":"The MAXIMUM CPU/memory a container can use. CPU is throttled; memory excess = OOMKilled.",
  "ResourceQuota":"Caps total resource consumption (CPU, memory, pods) for an entire namespace.",
  "LimitRange":"Sets default resource requests/limits for Pods in a namespace that don't set their own.",
  "StatefulSet":"A controller for stateful apps giving each Pod a stable name (pod-0, pod-1) and its own PVC.",
  "DaemonSet":"Ensures exactly one Pod runs on every node. Used for cluster-wide agents like log collectors.",
  "Job":"A controller that creates one or more Pods and tracks their completion. For batch tasks.",
  "CronJob":"Creates Jobs on a repeating schedule using cron syntax. For periodic tasks.",
  "etcd":"A distributed key-value store — the single source of truth for ALL cluster state. Losing etcd = losing the cluster.",
  "kubelet":"An agent on every worker node. Watches the API Server for Pod assignments and manages container lifecycle.",
  "kube-proxy":"Runs on every node maintaining iptables rules so Service ClusterIPs route to real Pod IPs.",
  "CoreDNS":"The cluster DNS server. Every Service gets a DNS name: service.namespace.svc.cluster.local.",
  "API Server":"The frontend of the K8s control plane. All commands (kubectl, controllers, nodes) communicate through it.",
  "Scheduler":"Control plane component that watches for unscheduled Pods and assigns them to nodes based on resources and constraints.",
  "Controller Manager":"Runs reconciliation loops for built-in controllers (Deployment, ReplicaSet, DaemonSet, etc.).",
  "Helm":"The package manager for Kubernetes. Bundles YAML manifests into versioned, configurable Charts.",
  "taint":"A property on a node that REPELS Pods unless they have a matching toleration.",
  "toleration":"A Pod property allowing it to be scheduled onto nodes with matching taints.",
  "nodeAffinity":"Rules on a Pod controlling which nodes it can run on, based on node labels.",
  "NetworkPolicy":"A firewall rule object for Pods restricting ingress/egress traffic based on labels.",
  "CrashLoopBackOff":"Pod status: the container keeps crashing; K8s restarts it with exponential backoff (10s, 20s, 40s...).",
  "ImagePullBackOff":"Pod status: K8s cannot pull the container image — wrong tag, private registry, or network issue.",
  "OOMKilled":"Pod exit code 137. Container exceeded its memory limit and the kernel killed it immediately.",
  "rolling update":"Default Deployment update strategy — replaces Pods gradually, zero downtime if probes are configured.",
  "maxSurge":"How many extra Pods above desired count can exist during a rolling update. Default: 25%.",
  "maxUnavailable":"How many Pods can be down during a rolling update. Default: 25%. Set to 0 for zero downtime.",
  "kubectl":"The CLI for interacting with a Kubernetes cluster. Communicates with the API Server.",
  "control plane":"The brain of the cluster: API Server, etcd, Scheduler, Controller Manager.",
  "worker node":"A machine running actual workloads: kubelet, kube-proxy, and a container runtime.",
  "emptyDir":"A temporary volume that lives for the Pod's lifetime. Deleted when Pod is removed.",
  "hostPath":"A volume mounting a file from the host node's filesystem into a Pod. Ties Pod to a node.",
  "QoS class":"Assigned automatically based on resource config. Controls eviction order under node pressure.",
  "endpoint":"Auto-created object containing actual IP:port pairs of Pods behind a Service.",
  "label":"A key-value pair attached to K8s objects, used by selectors for grouping and routing.",
  "selector":"A query matching objects by their labels. Services use selectors to find target Pods.",
  "annotation":"Key-value metadata on K8s objects NOT used for selecting — for tools like Helm and Ingress controllers.",
  "Metrics Server":"Collects CPU/memory metrics from kubelets every 15s. Required for HPA and kubectl top.",
  "KEDA":"Kubernetes Event-Driven Autoscaling. Scales on Kafka lag, SQS depth, HTTP rate, and 60+ other triggers.",
  "Cluster Autoscaler":"Automatically adds/removes NODES. Adds when Pods can't be scheduled; removes underutilized nodes.",
  "PodDisruptionBudget":"Guarantees minimum Pods available during voluntary disruptions like node drains or upgrades.",
  "affinity":"Rules controlling Pod placement relative to nodes (nodeAffinity) or other Pods (podAffinity/podAntiAffinity).",
  "volume":"A directory accessible to containers in a Pod. Can be backed by emptyDir, hostPath, PVC, ConfigMap, Secret, etc.",
  "manifest":"A YAML or JSON file describing a Kubernetes resource. Applied with kubectl apply -f.",
  "context":"A kubectl configuration entry combining a cluster, user, and namespace. Switch with kubectl config use-context.",
  "kubeconfig":"The config file (~/.kube/config) storing clusters, users, and contexts for kubectl.",
  "container runtime":"The software that runs containers on a node. Examples: containerd, CRI-O. Docker is no longer the default.",
  "CNI":"Container Network Interface. Plugin providing networking for Pods (Calico, Flannel, Cilium, Weave).",
  "CSI":"Container Storage Interface. Standardized plugin API allowing storage providers to work with K8s.",
  "CRD":"CustomResourceDefinition. Extends the K8s API with your own resource types. Used by Operators.",
  "Operator":"A K8s application packaging operational knowledge as code using CRDs and custom controllers.",
  "headless Service":"A Service with clusterIP: None. Gives each Pod its own DNS entry instead of a shared ClusterIP.",
  "init container":"A container that runs and completes before the main app containers start. Used for setup tasks.",
  "sidecar":"A container that runs alongside the main app container in the same Pod. Used for logging, proxies, etc.",
  "topology":"The physical/logical layout of a cluster — zones, regions, nodes. Used in affinity and topology spread constraints.",
  "reconciliation":"The K8s control loop: observe current state → compare to desired state → take corrective action.",
  "kubectl apply":"Creates or updates a K8s resource from a file. Idempotent — safe to run multiple times.",
  "dry-run":"A kubectl flag (--dry-run=client) that generates/validates YAML without creating any resources.",
  "port-forward":"kubectl port-forward exposes a Pod or Service port locally for testing without a Service.",
};

      {cmd:"kubectl cluster-info",why:"Confirms the API Server URL. If this fails, kubectl cannot reach the cluster."},
    ]},
    {title:"Create a dedicated namespace",cmds:[
      {cmd:"kubectl create ns blog",why:"Dedicated namespace isolates blog resources from other workloads."},
      {cmd:"kubectl config set-context --current --namespace=blog",why:"Sets blog as default namespace — no need for -n blog on every command."},
    ]},
    {title:"Generate Deployment YAML and apply",cmds:[
      {cmd:"kubectl create deployment ghost-blog --image=ghost:5-alpine --replicas=2 --dry-run=client -o yaml > ghost-deploy.yaml",why:"Generates complete Deployment YAML without creating anything. Edit before applying."},
      {cmd:"kubectl apply -f ghost-deploy.yaml",why:"Creates the Deployment. apply is idempotent — safe to run multiple times."},
      {cmd:"kubectl get pods -o wide",why:"Both Ghost Pods listed with their IPs and the node they landed on."},
    ]},
    {title:"Watch self-healing",cmds:[
      {cmd:"kubectl delete pod $(kubectl get pod -l app=ghost-blog -o jsonpath='{.items[0].metadata.name}')",why:"Deletes first Pod. ReplicaSet instantly creates a replacement."},
      {cmd:"kubectl get pods -w",why:"Within seconds, see a new Pod go from ContainerCreating to Running."},
    ]},
    {title:"Rolling update and rollback",cmds:[
      {cmd:"kubectl set image deployment/ghost-blog ghost=ghost:5-alpine --record",why:"Triggers rolling update. K8s creates new ReplicaSet and shifts Pods gradually."},
      {cmd:"kubectl rollout status deployment/ghost-blog",why:"Watches rollout progress — prints 'successfully rolled out' when done."},
      {cmd:"kubectl rollout undo deployment/ghost-blog",why:"Rolls back instantly by reactivating the previous ReplicaSet."},
    ]},
    {title:"Clean up",cmds:[
      {cmd:"kubectl delete ns blog",why:"Deletes namespace AND all resources inside — Deployment, ReplicaSet, all Pods."},
      {cmd:"kubectl config set-context --current --namespace=default",why:"Resets default namespace back to default."},
    ]},
  ]},
  {id:"debug-broken",phase:"foundation",title:"Debug a Broken Deployment",subtitle:"Diagnose and fix real-world failure modes",emoji:"🔍",duration:"~30 min",difficulty:"Beginner",ckaWeight:"Critical",
   goal:"Diagnose and fix ImagePullBackOff, CrashLoopBackOff, and Pending pods.",concepts:["kubectl describe","kubectl logs","Events","ImagePullBackOff","CrashLoopBackOff"],
   steps:[
    {title:"Create broken resources",cmds:[
      {cmd:"kubectl create ns debug-lab",why:"Isolated namespace for this exercise."},
      {cmd:"kubectl run broken-image --image=nginx:DOESNOTEXIST -n debug-lab",why:"Wrong image tag → ImagePullBackOff."},
      {cmd:"kubectl run crashloop --image=busybox -n debug-lab -- sh -c 'exit 1'",why:"Exits immediately with error → CrashLoopBackOff."},
    ]},
    {title:"Get the overview",cmds:[
      {cmd:"kubectl get pods -n debug-lab",why:"STATUS column reveals which Pods are broken."},
      {cmd:"kubectl get events -n debug-lab --sort-by=.lastTimestamp",why:"Event log tells you exactly what went wrong in plain English."},
    ]},
    {title:"Fix ImagePullBackOff",cmds:[
      {cmd:"kubectl describe pod broken-image -n debug-lab",why:"Events section: 'Failed to pull image nginx:DOESNOTEXIST: not found'."},
      {cmd:"kubectl delete pod broken-image -n debug-lab && kubectl run broken-image --image=nginx:alpine -n debug-lab",why:"Fix: recreate with a valid image tag."},
    ]},
    {title:"Fix CrashLoopBackOff",cmds:[
      {cmd:"kubectl logs crashloop -n debug-lab --previous",why:"--previous shows logs from the LAST crashed instance — often empty without this flag."},
      {cmd:"kubectl delete pod crashloop -n debug-lab && kubectl run crashloop --image=busybox -n debug-lab -- sh -c 'sleep 3600'",why:"Fix: command that stays running."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete ns debug-lab",why:"Removes all debug resources at once."}]},
  ]},
  {id:"pod-scheduling",phase:"foundation",title:"Pod Scheduling & Node Selection",subtitle:"nodeSelector, labels, and scheduling failures",emoji:"📍",duration:"~30 min",difficulty:"Beginner",ckaWeight:"Medium",
   goal:"Label nodes, schedule Pods to specific nodes, understand scheduling failures.",concepts:["nodeSelector","Labels","Scheduler","Pending","kubectl label"],
   steps:[
    {title:"Label a node",cmds:[
      {cmd:"kubectl get nodes --show-labels",why:"See existing labels including built-in topology labels."},
      {cmd:"kubectl label node $(kubectl get nodes -o jsonpath='{.items[0].metadata.name}') env=production",why:"Adds env=production — Pods can now target this node."},
    ]},
    {title:"Schedule Pod to labeled node",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: prod-pod\nspec:\n  nodeSelector:\n    env: production\n  containers:\n  - name: nginx\n    image: nginx\nEOF",why:"nodeSelector: only place this Pod on nodes with env=production label."},
      {cmd:"kubectl get pod prod-pod -o wide",why:"NODE column confirms Scheduler respected the nodeSelector."},
    ]},
    {title:"Simulate scheduling failure",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: impossible-pod\nspec:\n  nodeSelector:\n    env: doesnotexist\n  containers:\n  - name: nginx\n    image: nginx\nEOF",why:"No node has env=doesnotexist — Pod stays Pending forever."},
      {cmd:"kubectl describe pod impossible-pod | grep -A5 Events",why:"Shows: '0/1 nodes available: node(s) didn't match Pod's node affinity/selector'."},
    ]},
    {title:"Cleanup",cmds:[
      {cmd:"kubectl delete pod prod-pod impossible-pod",why:"Remove both pods."},
      {cmd:"kubectl label node $(kubectl get nodes -o jsonpath='{.items[0].metadata.name}') env-",why:"Remove the label — trailing dash is the removal syntax."},
    ]},
  ]},
  {id:"namespace-isolation",phase:"foundation",title:"Namespace Isolation & Cross-NS DNS",subtitle:"DNS scoping and cross-namespace routing",emoji:"🗂️",duration:"~25 min",difficulty:"Beginner",ckaWeight:"Medium",
   goal:"Prove cross-namespace needs FQDN and short names fail across namespaces.",concepts:["Namespace","CoreDNS","Service","Cross-namespace DNS"],
   steps:[
    {title:"Create namespaces and deploy",cmds:[
      {cmd:"kubectl create ns frontend && kubectl create ns backend",why:"Two namespaces simulating separate team environments."},
      {cmd:"kubectl create deployment api --image=httpd -n backend && kubectl expose deployment api --port=80 -n backend",why:"HTTP server in backend namespace with a Service named api."},
      {cmd:"kubectl run client --image=busybox -n frontend -- sleep 3600",why:"Long-running Pod in frontend for testing connectivity."},
    ]},
    {title:"Test cross-namespace DNS",cmds:[
      {cmd:"kubectl exec -n frontend client -- wget -qO- http://api.backend.svc.cluster.local",why:"FQDN: service.namespace.svc.cluster.local — the only way to reach a Service across namespaces."},
      {cmd:"kubectl exec -n frontend client -- wget -qO- http://api --timeout=3",why:"Short name FAILS from a different namespace — proves namespace DNS scoping."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete ns frontend backend",why:"Removes both namespaces and all resources."}]},
  ]},
  {id:"daemonset-jobs",phase:"foundation",title:"DaemonSets, Jobs & CronJobs",subtitle:"Node-level agents and batch workloads",emoji:"⚙️",duration:"~30 min",difficulty:"Beginner",ckaWeight:"Medium",
   goal:"Understand DaemonSet, Job, and CronJob — when to use each vs Deployment.",concepts:["DaemonSet","Job","CronJob","completions","parallelism"],
   steps:[
    {title:"Create a DaemonSet",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: apps/v1\nkind: DaemonSet\nmetadata:\n  name: log-agent\nspec:\n  selector:\n    matchLabels:\n      app: log-agent\n  template:\n    metadata:\n      labels:\n        app: log-agent\n    spec:\n      containers:\n      - name: agent\n        image: busybox\n        command: ['sh','-c','while true; do echo logging; sleep 5; done']\nEOF",why:"One Pod per node automatically. No replicas field — count follows node count."},
      {cmd:"kubectl get daemonset log-agent",why:"DESIRED equals number of nodes. New nodes auto-get a pod."},
    ]},
    {title:"Run a batch Job",cmds:[
      {cmd:"kubectl create job pi --image=perl:5 -- perl -Mbignum=bpi -wle 'print bpi(100)'",why:"Runs once to completion. Unlike Deployment, does NOT restart on success."},
      {cmd:"kubectl get jobs && kubectl logs job/pi",why:"Completions: 1/1. Logs show 100 digits of pi."},
    ]},
    {title:"Create a CronJob",cmds:[
      {cmd:"kubectl create cronjob backup --image=busybox --schedule='*/2 * * * *' -- sh -c 'echo backup at $(date)'",why:"Runs every 2 minutes. Creates a new Job each time it fires."},
      {cmd:"kubectl get cronjob backup -w",why:"Watch LAST-SCHEDULE update every 2 minutes."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete daemonset log-agent && kubectl delete job pi && kubectl delete cronjob backup",why:"Remove all three workload types."}]},
  ]},
  {id:"multi-container-patterns",phase:"foundation",title:"Multi-Container Pod Patterns",subtitle:"Sidecar, Init Container, and shared volumes",emoji:"🧩",duration:"~35 min",difficulty:"Beginner",ckaWeight:"Medium",
   goal:"Implement Sidecar and Init Container patterns using shared emptyDir volumes.",concepts:["Pod","emptyDir","initContainers","sidecar","shared volumes"],
   steps:[
    {title:"Sidecar pattern",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: sidecar-demo\nspec:\n  volumes:\n  - name: logs\n    emptyDir: {}\n  containers:\n  - name: app\n    image: busybox\n    command: ['sh','-c','while true; do echo $(date) >> /logs/app.log; sleep 2; done']\n    volumeMounts:\n    - name: logs\n      mountPath: /logs\n  - name: log-shipper\n    image: busybox\n    command: ['sh','-c','tail -f /logs/app.log']\n    volumeMounts:\n    - name: logs\n      mountPath: /logs\nEOF",why:"App writes; sidecar ships. Both share emptyDir. Clean separation of concerns."},
      {cmd:"kubectl logs sidecar-demo -c log-shipper -f",why:"-c selects specific container in a multi-container Pod."},
    ]},
    {title:"Init Container pattern",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: init-demo\nspec:\n  initContainers:\n  - name: setup\n    image: busybox\n    command: ['sh','-c','echo <h1>From Init</h1> > /work/index.html']\n    volumeMounts:\n    - name: work\n      mountPath: /work\n  containers:\n  - name: nginx\n    image: nginx\n    volumeMounts:\n    - name: work\n      mountPath: /usr/share/nginx/html\n  volumes:\n  - name: work\n    emptyDir: {}\nEOF",why:"Init container runs FIRST, writes index.html, exits. Nginx starts ONLY after init succeeds."},
      {cmd:"kubectl get pod init-demo",why:"Watch INIT:0/1 → PodInitializing → Running."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete pod sidecar-demo init-demo",why:"Remove both multi-container pods."}]},
  ]},
  {id:"kubectl-mastery",phase:"foundation",title:"kubectl Mastery — Core CLI Skills",subtitle:"jsonpath, dry-run, port-forward, and more",emoji:"⌨️",duration:"~25 min",difficulty:"Beginner",ckaWeight:"Critical",
   goal:"Master essential kubectl commands that appear in every CKA exam task.",concepts:["kubectl","dry-run","jsonpath","port-forward","label","annotation"],
   steps:[
    {title:"Generate YAML from imperative commands",cmds:[
      {cmd:"kubectl run nginx --image=nginx --dry-run=client -o yaml > pod.yaml",why:"The CKA-standard way to create YAML. Never write from scratch — generate and edit."},
      {cmd:"kubectl create deployment app --image=httpd --replicas=3 --dry-run=client -o yaml > deploy.yaml",why:"Same pattern for any resource type. Works for Service, ConfigMap, Secret, etc."},
      {cmd:"kubectl diff -f deploy.yaml",why:"Shows diff between your YAML and what's live. Safe to run before any apply."},
    ]},
    {title:"Extract specific fields with jsonpath",cmds:[
      {cmd:"kubectl get pods -o jsonpath='{.items[*].metadata.name}'",why:"Extracts all pod names — used in scripts and CKA exam tasks."},
      {cmd:"kubectl get pod nginx -o jsonpath='{.status.podIP}'",why:"Gets the Pod IP — useful for testing connectivity."},
      {cmd:"kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type==\"InternalIP\")].address}'",why:"Gets the node's internal IP — conditional jsonpath."},
    ]},
    {title:"Labels, annotations, and port-forward",cmds:[
      {cmd:"kubectl label pod nginx env=dev tier=frontend",why:"Multiple labels at once. Labels drive selector matching."},
      {cmd:"kubectl annotate deployment app description='my app' team=platform",why:"Annotations for tooling metadata — not used for selection."},
      {cmd:"kubectl port-forward pod/nginx 8080:80",why:"Access a Pod locally without a Service. Essential for quick debugging."},
      {cmd:"kubectl port-forward svc/my-svc 9090:80",why:"Port-forward a Service — forwards to one of its backend Pods."},
    ]},
    {title:"Useful shortcuts",cmds:[
      {cmd:"kubectl get po,svc,deploy -n default",why:"Comma-separate multiple resource types in one command."},
      {cmd:"kubectl delete pod --all -n dev",why:"Delete all pods in a namespace at once."},
      {cmd:"kubectl get pods --field-selector status.phase=Running",why:"Filter pods by their status phase using field selectors."},
    ]},
  ]},
  {id:"k8s-architecture",phase:"foundation",title:"Kubernetes Architecture Deep Dive",subtitle:"Control plane, worker nodes, and networking",emoji:"🏛️",duration:"~25 min",difficulty:"Beginner",ckaWeight:"High",
   goal:"Explore all cluster components hands-on — etcd, API Server, kubelet, CoreDNS.",concepts:["control plane","worker node","etcd","API Server","kubelet","CoreDNS","container runtime"],
   steps:[
    {title:"Explore the control plane",cmds:[
      {cmd:"kubectl get pods -n kube-system -o wide",why:"All control plane and system components. Node column shows which node each runs on."},
      {cmd:"kubectl describe pod -n kube-system $(kubectl get pod -n kube-system -l component=kube-apiserver -o jsonpath='{.items[0].metadata.name}')",why:"API Server pod details — shows flags, resource usage, and health."},
      {cmd:"kubectl get pod -n kube-system -l component=etcd -o yaml | grep image",why:"See the etcd image version — confirms etcd is running as a static pod."},
    ]},
    {title:"Inspect worker nodes",cmds:[
      {cmd:"kubectl describe node $(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')",why:"Full node details: capacity, allocatable resources, taints, conditions, and running Pods."},
      {cmd:"kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{.status.nodeInfo.containerRuntimeVersion}{\"\\n\"}{end}'",why:"Lists each node with its container runtime version — confirms containerd or CRI-O usage."},
    ]},
    {title:"Inspect networking components",cmds:[
      {cmd:"kubectl get pods -n kube-system -l k8s-app=kube-dns",why:"CoreDNS pods — the cluster DNS server that all Pod DNS queries go through."},
      {cmd:"kubectl exec -n kube-system $(kubectl get pod -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[0].metadata.name}') -- cat /etc/coredns/Corefile",why:"The CoreDNS config file — shows how DNS is configured for the cluster."},
    ]},
    {title:"Verify cluster health",cmds:[
      {cmd:"kubectl get componentstatuses",why:"Shows health of control plane components — scheduler, controller-manager, etcd."},
      {cmd:"kubectl get events -A --sort-by=.lastTimestamp | tail -20",why:"Last 20 cluster-wide events — first place to check after any cluster issue."},
    ]},
  ]},

  // ── INTERMEDIATE 8 ──────────────────────────────────────────────────────────
  {id:"microservices",phase:"intermediate",title:"3-Tier Microservices App",subtitle:"Frontend + API + Redis with Services, ConfigMaps & Secrets",emoji:"🏗️",duration:"~60 min",difficulty:"Intermediate",ckaWeight:"High",
   goal:"Deploy a 3-tier app wired with Services, ConfigMaps, and Secrets.",concepts:["ClusterIP","DNS-based discovery","ConfigMaps","Secrets","Endpoints"],
   steps:[
    {title:"Set up namespace",cmds:[{cmd:"kubectl create ns myapp && kubectl config set-context --current --namespace=myapp",why:"Dedicated namespace for all 3 tiers."}]},
    {title:"Deploy Redis",cmds:[
      {cmd:"kubectl create deployment redis --image=redis:7-alpine --replicas=1",why:"Redis deployment — 1 replica."},
      {cmd:"kubectl expose deployment redis --port=6379 --name=redis-svc",why:"ClusterIP Service. API connects via redis-svc:6379 DNS name."},
      {cmd:"kubectl get endpoints redis-svc",why:"Must show at least one endpoint IP. If empty, selector doesn't match any Pod."},
    ]},
    {title:"Create ConfigMap and Secret",cmds:[
      {cmd:"kubectl create configmap api-config --from-literal=REDIS_HOST=redis-svc --from-literal=REDIS_PORT=6379",why:"REDIS_HOST=redis-svc — API connects by DNS name, never by IP."},
      {cmd:"kubectl create secret generic api-secret --from-literal=API_KEY=supersecretkey123",why:"Stores API key as Opaque Secret."},
    ]},
    {title:"Break and fix Service selector",cmds:[
      {cmd:"kubectl patch svc redis-svc -p '{\"spec\":{\"selector\":{\"app\":\"wrong\"}}}'",why:"Selector matches no Pods — traffic silently dropped."},
      {cmd:"kubectl get endpoints redis-svc",why:"Shows <none> — the definitive sign of a broken selector."},
      {cmd:"kubectl patch svc redis-svc -p '{\"spec\":{\"selector\":{\"app\":\"redis\"}}}'",why:"Fix: restore correct selector. Endpoints repopulate instantly."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete ns myapp && kubectl config set-context --current --namespace=default",why:"Deletes everything inside."}]},
  ]},
  {id:"stateful-db",phase:"intermediate",title:"Stateful Database with Persistent Storage",subtitle:"PostgreSQL with PVC — data survives pod restarts",emoji:"🗄️",duration:"~40 min",difficulty:"Intermediate",ckaWeight:"High",
   goal:"Write data, kill Pod, verify data survives — proving K8s runs stateful workloads.",concepts:["PersistentVolume","PersistentVolumeClaim","StorageClass","Data persistence"],
   steps:[
    {title:"Check available storage",cmds:[
      {cmd:"kubectl create ns db-lab && kubectl config set-context --current --namespace=db-lab",why:"Dedicated namespace."},
      {cmd:"kubectl get storageclass",why:"The (default) StorageClass auto-provisions PVs when a PVC is created."},
    ]},
    {title:"Create PVC",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: postgres-pvc\nspec:\n  accessModes: [ReadWriteOnce]\n  resources:\n    requests:\n      storage: 1Gi\nEOF",why:"1Gi PVC with ReadWriteOnce. StorageClass auto-provisions a matching PV."},
      {cmd:"kubectl get pvc postgres-pvc",why:"STATUS must be Bound before deploying the DB."},
    ]},
    {title:"Write data, kill Pod, verify",cmds:[
      {cmd:"kubectl exec -it $(kubectl get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}') -- psql -U postgres -c \"CREATE TABLE users (id SERIAL, name TEXT); INSERT INTO users(name) VALUES ('Alice'),('Bob');\"",why:"Writes to the PVC-backed volume — NOT the ephemeral container filesystem."},
      {cmd:"kubectl delete pod -l app=postgres",why:"Kills Postgres. Replacement Pod mounts the SAME PVC."},
      {cmd:"kubectl exec -it $(kubectl get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}') -- psql -U postgres -c 'SELECT * FROM users;'",why:"Both rows survive — data persisted across Pod deletion."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete ns db-lab && kubectl config set-context --current --namespace=default",why:"Removes namespace. With Delete reclaim policy, PV data is also gone."}]},
  ]},
  {id:"probes-resources",phase:"intermediate",title:"Health Probes & Resource Management",subtitle:"Configure probes, trigger OOMKill, enforce quotas",emoji:"💓",duration:"~35 min",difficulty:"Intermediate",ckaWeight:"High",
   goal:"All three probes, readiness gating, OOMKill, and namespace ResourceQuota.",concepts:["livenessProbe","readinessProbe","startupProbe","Resource Limit","OOMKilled","ResourceQuota"],
   steps:[
    {title:"Deploy with all three probes",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: probe-demo\nspec:\n  replicas: 2\n  selector:\n    matchLabels:\n      app: probe-demo\n  template:\n    metadata:\n      labels:\n        app: probe-demo\n    spec:\n      containers:\n      - name: app\n        image: nginx\n        resources:\n          requests: {cpu: 100m, memory: 64Mi}\n          limits: {cpu: 200m, memory: 128Mi}\n        startupProbe:\n          httpGet: {path: /, port: 80}\n          failureThreshold: 30\n          periodSeconds: 2\n        readinessProbe:\n          httpGet: {path: /, port: 80}\n          initialDelaySeconds: 3\n          periodSeconds: 5\n        livenessProbe:\n          httpGet: {path: /, port: 80}\n          initialDelaySeconds: 15\n          periodSeconds: 10\nEOF",why:"startupProbe first. readinessProbe gates traffic. livenessProbe auto-restarts deadlocked containers."},
    ]},
    {title:"Trigger an OOMKill",cmds:[
      {cmd:"kubectl run oom-test --image=polinux/stress --limits=memory=64Mi -- stress --vm 1 --vm-bytes 128M",why:"Tries to allocate 128MB but limit is 64MB — kernel OOM killer terminates immediately."},
      {cmd:"kubectl describe pod oom-test | grep -A3 'Last State'",why:"Shows: Reason: OOMKilled. Fix: increase memory limit or fix memory leak."},
    ]},
    {title:"Apply ResourceQuota",cmds:[
      {cmd:"kubectl create ns quota-test",why:"Namespace for quota demonstration."},
      {cmd:"cat <<'EOF' | kubectl apply -n quota-test -f -\napiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name: team-quota\nspec:\n  hard:\n    pods: \"5\"\n    requests.cpu: \"1\"\n    requests.memory: 1Gi\nEOF",why:"Max 5 pods, 1 CPU, 1Gi memory. Exceeding any dimension rejects the Pod."},
      {cmd:"kubectl describe resourcequota team-quota -n quota-test",why:"Shows Used vs Hard for each dimension."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete pod oom-test && kubectl delete deployment probe-demo && kubectl delete ns quota-test",why:"Remove all resources."}]},
  ]},
  {id:"configmap-secret-volumes",phase:"intermediate",title:"ConfigMaps & Secrets as Volumes",subtitle:"Mount config files and inject credentials",emoji:"🔑",duration:"~30 min",difficulty:"Intermediate",ckaWeight:"Medium",
   goal:"Mount ConfigMap as file, inject Secret as env var, prove live ConfigMap updates.",concepts:["ConfigMap","Secret","Volume mounts","env vars","live update"],
   steps:[
    {title:"Create ConfigMap from file",cmds:[
      {cmd:"echo 'server { listen 8080; location /health { return 200 ok; } }' > nginx.conf && kubectl create configmap nginx-config --from-file=nginx.conf",why:"ConfigMap key = filename, value = content. Will be mounted as a real file inside the Pod."},
    ]},
    {title:"Mount as file",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: nginx-custom\nspec:\n  containers:\n  - name: nginx\n    image: nginx\n    volumeMounts:\n    - name: config-vol\n      mountPath: /etc/nginx/conf.d\n  volumes:\n  - name: config-vol\n    configMap:\n      name: nginx-config\nEOF",why:"Mounts nginx-config into /etc/nginx/conf.d. Key becomes the filename."},
      {cmd:"kubectl exec nginx-custom -- cat /etc/nginx/conf.d/nginx.conf",why:"Proves the file exists inside the container exactly as defined."},
    ]},
    {title:"Inject Secret as env var",cmds:[
      {cmd:"kubectl create secret generic db-creds --from-literal=DB_PASSWORD=s3cr3tP@ss",why:"Creates the Secret. Password is base64-encoded internally."},
      {cmd:"kubectl exec nginx-custom -- env | grep DB",why:"Confirms decoded password is available as env var inside container."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete pod nginx-custom && kubectl delete configmap nginx-config && kubectl delete secret db-creds",why:"Remove all resources."}]},
  ]},
  {id:"service-types-ingress",phase:"intermediate",title:"Service Types & Ingress Routing",subtitle:"ClusterIP, NodePort, and path-based Ingress",emoji:"🌐",duration:"~40 min",difficulty:"Intermediate",ckaWeight:"High",
   goal:"Understand all three main Service types and wire up path-based Ingress routing.",concepts:["ClusterIP","NodePort","LoadBalancer","Ingress","Ingress Controller","path-based routing"],
   steps:[
    {title:"Deploy two apps",cmds:[
      {cmd:"kubectl create deployment app-a --image=nginx && kubectl create deployment app-b --image=httpd",why:"Two apps for path-based routing."},
      {cmd:"kubectl expose deployment app-a --port=80 --name=svc-a && kubectl expose deployment app-b --port=80 --name=svc-b",why:"ClusterIP Services — only accessible inside cluster."},
    ]},
    {title:"Test ClusterIP vs NodePort",cmds:[
      {cmd:"kubectl expose deployment app-a --port=80 --type=NodePort --name=svc-a-np",why:"NodePort opens a port (30000–32767) on every node — externally accessible."},
      {cmd:"kubectl get svc svc-a-np",why:"NODE-PORT column shows assigned port. Access via <node-ip>:<nodeport>."},
    ]},
    {title:"Create Ingress rules",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: app-ingress\nspec:\n  rules:\n  - http:\n      paths:\n      - path: /app-a\n        pathType: Prefix\n        backend:\n          service:\n            name: svc-a\n            port:\n              number: 80\n      - path: /app-b\n        pathType: Prefix\n        backend:\n          service:\n            name: svc-b\n            port:\n              number: 80\nEOF",why:"Path-based routing: /app-a → svc-a, /app-b → svc-b. Requires Ingress Controller running."},
      {cmd:"kubectl get ingress app-ingress",why:"ADDRESS empty = Ingress Controller not running yet."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete deployment app-a app-b && kubectl delete svc svc-a svc-b svc-a-np && kubectl delete ingress app-ingress",why:"Remove all resources."}]},
  ]},
  {id:"statefulset-demo",phase:"intermediate",title:"StatefulSet vs Deployment",subtitle:"Stable pod identity and ordered operations",emoji:"📊",duration:"~35 min",difficulty:"Intermediate",ckaWeight:"High",
   goal:"Deploy a StatefulSet — observe stable names, ordered startup, and per-pod PVCs.",concepts:["StatefulSet","stable identity","ordered startup","headless Service","volumeClaimTemplates"],
   steps:[
    {title:"Create headless Service and StatefulSet",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Service\nmetadata:\n  name: web-headless\nspec:\n  clusterIP: None\n  selector:\n    app: web-ss\n  ports:\n  - port: 80\n---\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: web\nspec:\n  serviceName: web-headless\n  replicas: 3\n  selector:\n    matchLabels:\n      app: web-ss\n  template:\n    metadata:\n      labels:\n        app: web-ss\n    spec:\n      containers:\n      - name: nginx\n        image: nginx\n        volumeMounts:\n        - name: data\n          mountPath: /usr/share/nginx/html\n  volumeClaimTemplates:\n  - metadata:\n      name: data\n    spec:\n      accessModes: [ReadWriteOnce]\n      resources:\n        requests:\n          storage: 100Mi\nEOF",why:"clusterIP: None = headless — each Pod gets own DNS. volumeClaimTemplates = separate PVC per Pod."},
      {cmd:"kubectl get pods -l app=web-ss",why:"Pods named web-0, web-1, web-2 — stable predictable names unlike Deployment random hashes."},
    ]},
    {title:"Observe stable identity",cmds:[
      {cmd:"kubectl get pvc",why:"Each Pod has its own PVC: data-web-0, data-web-1, data-web-2."},
      {cmd:"kubectl exec web-0 -- hostname && kubectl exec web-1 -- hostname",why:"Each Pod knows its stable hostname — crucial for leader election in databases."},
    ]},
    {title:"Scale and observe ordering",cmds:[
      {cmd:"kubectl scale statefulset web --replicas=1",why:"Scales DOWN from web-2 → web-1 → web-0 in reverse order. Prevents data corruption."},
      {cmd:"kubectl get pods -w",why:"Watch ordered termination — web-2 deleted first, then web-1."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete statefulset web && kubectl delete svc web-headless && kubectl delete pvc -l app=web-ss",why:"Must delete PVCs manually — StatefulSet deletion does NOT auto-delete PVCs to protect data."}]},
  ]},
  {id:"multicontainer-intermediate",phase:"intermediate",title:"Advanced Multi-Container Patterns",subtitle:"Ambassador, shared memory, and lifecycle hooks",emoji:"🔗",duration:"~30 min",difficulty:"Intermediate",ckaWeight:"Medium",
   goal:"Implement Ambassador proxy pattern and use lifecycle hooks for graceful startup/shutdown.",concepts:["sidecar","emptyDir","volume","init container","lifecycle hooks","postStart","preStop"],
   steps:[
    {title:"Ambassador proxy pattern",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: ambassador-demo\nspec:\n  containers:\n  - name: app\n    image: busybox\n    command: ['sh','-c','while true; do wget -qO- http://localhost:8080; sleep 3; done']\n  - name: ambassador\n    image: nginx\n    ports:\n    - containerPort: 8080\nEOF",why:"App calls localhost:8080 — the ambassador container proxies to an external service. App doesn't know about the external dependency."},
      {cmd:"kubectl logs ambassador-demo -c app",why:"Shows app output — confirms it's communicating through the ambassador container."},
    ]},
    {title:"Lifecycle hooks",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: lifecycle-demo\nspec:\n  containers:\n  - name: app\n    image: nginx\n    lifecycle:\n      postStart:\n        exec:\n          command: ['/bin/sh','-c','echo Started at $(date) > /tmp/started']\n      preStop:\n        exec:\n          command: ['/bin/sh','-c','sleep 5 && echo Stopping gracefully']\nEOF",why:"postStart runs immediately after container starts. preStop runs before SIGTERM — allows graceful shutdown."},
      {cmd:"kubectl exec lifecycle-demo -- cat /tmp/started",why:"Confirms postStart hook executed and wrote the timestamp file."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete pod ambassador-demo lifecycle-demo",why:"Remove both pods."}]},
  ]},
  {id:"networking-deep",phase:"intermediate",title:"Networking Deep Dive",subtitle:"DNS, Services, endpoints, and kube-proxy",emoji:"🕸️",duration:"~35 min",difficulty:"Intermediate",ckaWeight:"High",
   goal:"Understand exactly how traffic flows from one Pod to another through Services.",concepts:["CoreDNS","endpoint","kube-proxy","ClusterIP","Service","DNS resolution"],
   steps:[
    {title:"Deploy and inspect DNS",cmds:[
      {cmd:"kubectl create deployment web --image=nginx --replicas=3 && kubectl expose deployment web --port=80 --name=web-svc",why:"Creates a Deployment and ClusterIP Service to inspect."},
      {cmd:"kubectl run dns-test --image=busybox --rm -it -- nslookup web-svc",why:"DNS lookup inside the cluster. CoreDNS returns the ClusterIP, not individual Pod IPs."},
      {cmd:"kubectl run dns-test2 --image=busybox --rm -it -- nslookup web-svc.default.svc.cluster.local",why:"Full FQDN lookup — same result, confirms CoreDNS search domain expansion."},
    ]},
    {title:"Inspect the Endpoints object",cmds:[
      {cmd:"kubectl get endpoints web-svc",why:"Shows the actual Pod IPs behind the Service — kube-proxy uses this to program iptables rules."},
      {cmd:"kubectl get endpoints web-svc -o yaml",why:"Full Endpoints YAML — shows subsets with each ready Pod IP and port."},
    ]},
    {title:"Trace traffic with iptables",cmds:[
      {cmd:"kubectl run tracer --image=busybox --rm -it -- wget -qO- http://web-svc",why:"Traffic: DNS → ClusterIP → iptables DNAT → Pod IP. Every request may go to a different Pod."},
      {cmd:"kubectl scale deployment web --replicas=0 && kubectl get endpoints web-svc",why:"Endpoints become empty when no Pods are ready. Service still exists but routes to nothing."},
      {cmd:"kubectl scale deployment web --replicas=3",why:"Endpoints repopulate as new Pods pass readiness checks."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete deployment web && kubectl delete svc web-svc",why:"Remove all resources."}]},
  ]},

  // ── ADVANCED 8 ──────────────────────────────────────────────────────────────
  {id:"rbac-secure",phase:"advanced",title:"Lock Down a Multi-Team Cluster",subtitle:"RBAC + Namespaces + Resource Quotas",emoji:"🔐",duration:"~50 min",difficulty:"Advanced",ckaWeight:"Critical",
   goal:"Backend (full), frontend-team (read-only), CI/CD bot (deploy-only) with RBAC.",concepts:["RBAC","ServiceAccount","Role","ClusterRole","RoleBinding","ResourceQuota"],
   steps:[
    {title:"Create team namespaces",cmds:[{cmd:"kubectl create ns backend && kubectl create ns frontend && kubectl create ns staging",why:"Three namespaces — foundation of multi-team isolation."}]},
    {title:"Backend Team — full namespace access",cmds:[
      {cmd:"kubectl create role backend-admin -n backend --verb='*' --resource='*'",why:"Wildcard verbs and resources — full access inside backend namespace only."},
      {cmd:"kubectl create rolebinding backend-team-binding -n backend --role=backend-admin --user=backend-dev",why:"Binds role to backend-dev user."},
      {cmd:"kubectl auth can-i create deployments -n backend --as=backend-dev && kubectl auth can-i create deployments -n frontend --as=backend-dev",why:"First: yes. Second: no — Role is namespace-scoped to backend only."},
    ]},
    {title:"Frontend Team — read-only",cmds:[
      {cmd:"kubectl create role frontend-readonly -n frontend --verb=get,list,watch --resource=pods,deployments,services,configmaps,events",why:"Read-only — get/list/watch only. Secrets not in the list."},
      {cmd:"kubectl create rolebinding frontend-binding -n frontend --role=frontend-readonly --user=frontend-dev",why:"Binds read-only role to frontend-dev."},
      {cmd:"kubectl auth can-i delete pods -n frontend --as=frontend-dev",why:"Returns no — delete verb not granted."},
    ]},
    {title:"CI/CD Bot — deploy-only ServiceAccount",cmds:[
      {cmd:"kubectl create serviceaccount cicd-bot -n staging && kubectl create role cicd-deployer -n staging --verb=get,list,watch,create,update,patch --resource=deployments,replicasets,pods",why:"Machine identity + role that can create/update but NOT delete Deployments."},
      {cmd:"kubectl create rolebinding cicd-bind -n staging --role=cicd-deployer --serviceaccount=staging:cicd-bot",why:"Binds role to ServiceAccount."},
      {cmd:"kubectl auth can-i update deployments -n staging --as=system:serviceaccount:staging:cicd-bot",why:"Returns yes — CI/CD can deploy."},
    ]},
    {title:"Enforce ResourceQuota",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: ResourceQuota\nmetadata:\n  name: backend-quota\n  namespace: backend\nspec:\n  hard:\n    requests.cpu: \"2\"\n    requests.memory: 4Gi\n    limits.cpu: \"4\"\n    limits.memory: 8Gi\n    pods: \"20\"\nEOF",why:"Caps backend: 2 CPU request, 4Gi memory, 20 Pods max."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete ns backend frontend staging",why:"Removes all 3 namespaces."}]},
  ]},
  {id:"autoscale-prod",phase:"advanced",title:"Production Auto-Scaling Under Load",subtitle:"HPA + Rolling Deployments + Load Testing",emoji:"⚡",duration:"~60 min",difficulty:"Advanced",ckaWeight:"High",
   goal:"Configure HPA, generate real load, watch scale-up, do a zero-downtime rolling update.",concepts:["HPA","Metrics Server","Rolling Updates","kubectl top","Load testing"],
   steps:[
    {title:"Install Metrics Server",cmds:[
      {cmd:"kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml",why:"Required for HPA. Without it, HPA shows UNKNOWN and can't make scaling decisions."},
      {cmd:"kubectl get pods -n kube-system -l k8s-app=metrics-server -w",why:"Wait until Running before proceeding."},
    ]},
    {title:"Deploy and create HPA",cmds:[
      {cmd:"kubectl create deployment webapp --image=registry.k8s.io/hpa-example --replicas=1 && kubectl expose deployment webapp --port=80 --name=webapp-svc",why:"hpa-example does CPU work per request — perfect for triggering HPA."},
      {cmd:"kubectl set resources deployment webapp --requests=cpu=200m,memory=128Mi --limits=cpu=500m,memory=256Mi",why:"CRITICAL: HPA calculates scale as actual_cpu / requested_cpu. No request = no HPA."},
      {cmd:"kubectl autoscale deployment webapp --cpu-percent=50 --min=2 --max=10",why:"Target 50% of 200m CPU = 100m. Scale between 2 and 10."},
    ]},
    {title:"Generate load and watch",cmds:[
      {cmd:"kubectl run load-gen --image=busybox --restart=Never -- sh -c 'while true; do wget -q -O- http://webapp-svc; done'",why:"Hammers webapp in a tight loop."},
      {cmd:"kubectl get hpa -w",why:"Watch TARGETS climb and REPLICAS increase in real-time."},
    ]},
    {title:"Zero-downtime rolling update",cmds:[
      {cmd:"kubectl run canary --image=busybox --restart=Never -- sh -c 'i=0; while true; do wget -q -O- http://webapp-svc && echo \" OK $((++i))\" || echo FAILED; sleep 0.5; done'",why:"Zero FAILED lines = zero downtime deployment."},
      {cmd:"kubectl set image deployment/webapp hpa-example=nginx:alpine && kubectl rollout status deployment/webapp",why:"Triggers rolling update while canary monitors."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete pod load-gen canary --ignore-not-found && kubectl delete deployment webapp && kubectl delete svc webapp-svc && kubectl delete hpa webapp",why:"Remove all load testing resources."}]},
  ]},
  {id:"node-drain",phase:"advanced",title:"Node Maintenance Without Downtime",subtitle:"Drain, cordon, PodDisruptionBudgets",emoji:"🔧",duration:"~35 min",difficulty:"Advanced",ckaWeight:"Critical",
   goal:"Drain a node for OS patching using PDB to prevent downtime, then bring it back.",concepts:["kubectl drain","kubectl cordon","PodDisruptionBudget","taints","tolerations"],
   steps:[
    {title:"Create PodDisruptionBudget",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata:\n  name: webapp-pdb\nspec:\n  minAvailable: 2\n  selector:\n    matchLabels:\n      app: webapp\nEOF",why:"Ensures at least 2 webapp Pods remain available during drain."},
      {cmd:"kubectl get pdb",why:"ALLOWED-DISRUPTIONS — how many Pods can be evicted now without violating PDB."},
    ]},
    {title:"Cordon and drain",cmds:[
      {cmd:"kubectl cordon <node-name>",why:"SchedulingDisabled — no NEW Pods placed here. Existing Pods keep running."},
      {cmd:"kubectl drain <node-name> --ignore-daemonsets --delete-emptydir-data",why:"Evicts all Pods. K8s respects PDB — won't evict if it violates minAvailable."},
      {cmd:"kubectl get pods -o wide",why:"Watch Pods move to remaining nodes."},
    ]},
    {title:"Bring node back",cmds:[
      {cmd:"kubectl uncordon <node-name>",why:"Re-enables scheduling. New Pods start landing here again."},
      {cmd:"kubectl get nodes",why:"Confirms STATUS is back to Ready."},
    ]},
  ]},
  {id:"network-policy",phase:"advanced",title:"Zero-Trust Networking with NetworkPolicies",subtitle:"Block all traffic, then selectively allow",emoji:"🛡️",duration:"~45 min",difficulty:"Advanced",ckaWeight:"High",
   goal:"Deny all, then allow only frontend→API and API→DB.",concepts:["NetworkPolicy","ingress rules","egress rules","Pod selectors","zero-trust"],
   steps:[
    {title:"Set up 3-tier app",cmds:[
      {cmd:"kubectl create ns secure-app && kubectl create deployment frontend --image=nginx -n secure-app && kubectl create deployment api --image=httpd -n secure-app && kubectl create deployment db --image=postgres -n secure-app",why:"3 deployments: frontend, API, database tiers."},
      {cmd:"kubectl label deployment api tier=api -n secure-app && kubectl label deployment db tier=database -n secure-app && kubectl label deployment frontend tier=frontend -n secure-app",why:"Labels are the basis for NetworkPolicy selectors."},
    ]},
    {title:"Apply default deny-all",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-all\n  namespace: secure-app\nspec:\n  podSelector: {}\n  policyTypes: [Ingress, Egress]\nEOF",why:"Empty podSelector matches ALL Pods. All traffic blocked — zero-trust baseline."},
    ]},
    {title:"Allow frontend → API only",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-frontend-to-api\n  namespace: secure-app\nspec:\n  podSelector:\n    matchLabels: {tier: api}\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels: {tier: frontend}\n    ports:\n    - {protocol: TCP, port: 80}\nEOF",why:"Only Pods with tier=frontend can reach API on port 80."},
    ]},
    {title:"Allow API → DB only",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-api-to-db\n  namespace: secure-app\nspec:\n  podSelector:\n    matchLabels: {tier: database}\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels: {tier: api}\n    ports:\n    - {protocol: TCP, port: 5432}\nEOF",why:"Only API Pods reach DB on 5432. Frontend→DB still blocked."},
      {cmd:"kubectl get networkpolicies -n secure-app",why:"3 policies: default-deny-all, allow-frontend-to-api, allow-api-to-db."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"kubectl delete ns secure-app",why:"Removes namespace and all NetworkPolicies inside."}]},
  ]},
  {id:"helm-gitops",phase:"advanced",title:"Helm Deployment & Rollback",subtitle:"Package, version, and roll back with Helm",emoji:"⛵",duration:"~45 min",difficulty:"Advanced",ckaWeight:"Medium",
   goal:"Install a chart, simulate a bad upgrade, and use helm rollback to recover.",concepts:["Helm","Chart","values.yaml","Release","rollback","upgrade","--atomic"],
   steps:[
    {title:"Add repo and install",cmds:[
      {cmd:"helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update",why:"Adds Bitnami repo and fetches latest chart index."},
      {cmd:"cat > my-values.yaml <<'EOF'\nreplicaCount: 2\nservice:\n  type: ClusterIP\nresources:\n  requests:\n    cpu: 100m\n    memory: 64Mi\nEOF",why:"Values file overrides defaults. Version-control this alongside your code."},
      {cmd:"helm install my-nginx bitnami/nginx -f my-values.yaml --create-namespace -n helm-demo",why:"Installs release named my-nginx using custom values. Revision 1."},
    ]},
    {title:"Bad upgrade and rollback",cmds:[
      {cmd:"helm upgrade my-nginx bitnami/nginx -n helm-demo --set image.tag=broken-tag-999",why:"Bad image tag — pods will ImagePullBackOff."},
      {cmd:"helm rollback my-nginx 1 -n helm-demo",why:"Rolls back to revision 1 instantly."},
      {cmd:"helm history my-nginx -n helm-demo",why:"Revision 1 (deployed), 2 (failed), 3 (rolled back)."},
    ]},
    {title:"Cleanup",cmds:[{cmd:"helm uninstall my-nginx -n helm-demo && kubectl delete ns helm-demo",why:"Removes release AND all K8s resources it created."}]},
  ]},
  {id:"affinity-taints",phase:"advanced",title:"Pod Placement: Affinity & Taints",subtitle:"Control exactly where Pods land",emoji:"🎯",duration:"~40 min",difficulty:"Advanced",ckaWeight:"High",
   goal:"Use nodeAffinity, podAntiAffinity, taints, and tolerations for production-grade scheduling.",concepts:["nodeAffinity","affinity","taint","toleration","topologyKey","PodAntiAffinity"],
   steps:[
    {title:"Taint a node",cmds:[
      {cmd:"kubectl taint nodes $(kubectl get nodes -o jsonpath='{.items[0].metadata.name}') dedicated=gpu:NoSchedule",why:"Taint repels Pods. Only Pods with matching toleration can land here."},
      {cmd:"kubectl run no-tol --image=nginx",why:"Lands on an un-tainted node. The tainted node refuses it."},
    ]},
    {title:"NodeAffinity — prefer a zone",cmds:[
      {cmd:"kubectl label node $(kubectl get nodes -o jsonpath='{.items[0].metadata.name}') zone=us-east-1a",why:"Label node with zone — used as affinity target."},
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: v1\nkind: Pod\nmetadata:\n  name: affinity-pod\nspec:\n  affinity:\n    nodeAffinity:\n      preferredDuringSchedulingIgnoredDuringExecution:\n      - weight: 100\n        preference:\n          matchExpressions:\n          - {key: zone, operator: In, values: [us-east-1a]}\n  containers:\n  - name: nginx\n    image: nginx\nEOF",why:"preferred = soft constraint. Tries us-east-1a but uses other nodes if unavailable."},
    ]},
    {title:"PodAntiAffinity — spread replicas",cmds:[
      {cmd:"cat <<'EOF' | kubectl apply -f -\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: spread-app\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: spread-app\n  template:\n    metadata:\n      labels:\n        app: spread-app\n    spec:\n      affinity:\n        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n          - labelSelector:\n              matchLabels:\n                app: spread-app\n            topologyKey: kubernetes.io/hostname\n      containers:\n      - name: nginx\n        image: nginx\nEOF",why:"HARD constraint — no two spread-app Pods can share the same node. Goes Pending if not enough nodes."},
      {cmd:"kubectl get pods -l app=spread-app -o wide",why:"Each Pod runs on a DIFFERENT node — anti-affinity enforced."},
    ]},
    {title:"Cleanup",cmds:[
      {cmd:"kubectl taint nodes $(kubectl get nodes -o jsonpath='{.items[0].metadata.name}') dedicated:NoSchedule-",why:"Remove taint — trailing dash removes it."},
      {cmd:"kubectl delete pod no-tol affinity-pod && kubectl delete deployment spread-app",why:"Remove all pods and deployment."},
    ]},
  ]},
  {id:"advanced-debugging",phase:"advanced",title:"Advanced Cluster Debugging",subtitle:"OOMKill, eviction, etcd health, audit logs",emoji:"🔬",duration:"~45 min",difficulty:"Advanced",ckaWeight:"Critical",
   goal:"Debug complex production scenarios: node pressure, OOMKill chains, and component health.",concepts:["OOMKilled","QoS class","eviction","node pressure","etcd","componentstatuses"],
   steps:[
    {title:"Diagnose node pressure",cmds:[
      {cmd:"kubectl describe nodes | grep -A10 'Conditions'",why:"Shows MemoryPressure, DiskPressure, PIDPressure conditions. True = node under stress."},
      {cmd:"kubectl get pods -A --field-selector status.phase=Failed",why:"Lists all failed Pods cluster-wide — often the result of node pressure evictions."},
      {cmd:"kubectl describe pod <evicted-pod> | grep -A5 'Reason'",why:"Shows: Reason: Evicted. Message explains the eviction cause (memory, disk)."},
    ]},
    {title:"Trace OOMKill chain",cmds:[
      {cmd:"kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.name}{\" \"}{range .status.containerStatuses[*]}{.lastState.terminated.reason}{\" \"}{end}{\"\\n\"}{end}' | grep OOMKilled",why:"One-liner to find ALL OOMKilled containers cluster-wide — essential for production debugging."},
      {cmd:"kubectl top pods -A --sort-by=memory",why:"Sorted by memory usage — find the highest consumers before they OOMKill."},
    ]},
    {title:"Check cluster component health",cmds:[
      {cmd:"kubectl get componentstatuses",why:"Health of scheduler, controller-manager, etcd. Any Unhealthy = control plane issue."},
      {cmd:"kubectl get pods -n kube-system --sort-by='.status.containerStatuses[0].restartCount'",why:"Pods sorted by restart count — high restarts signal unhealthy control plane components."},
    ]},
    {title:"Advanced resource analysis",cmds:[
      {cmd:"kubectl get nodes -o custom-columns=NAME:.metadata.name,CPU-REQ:.status.allocatable.cpu,MEM-REQ:.status.allocatable.memory",why:"See allocatable resources per node — what's available after system reservation."},
      {cmd:"kubectl describe nodes | grep -A5 'Non-terminated Pods'",why:"Shows how many Pods are on each node and their total CPU/memory requests."},
    ]},
  ]},
  {id:"cicd-integration",phase:"advanced",title:"CI/CD Pipeline Integration",subtitle:"ServiceAccounts, image updates, rollout verification",emoji:"🚀",duration:"~40 min",difficulty:"Advanced",ckaWeight:"Medium",
   goal:"Build a CI/CD-ready workflow: automated deploy, verify, and rollback on failure.",concepts:["ServiceAccount","RBAC","rollout","kubectl wait","kubectl rollout","automated deploy"],
   steps:[
    {title:"Create pipeline ServiceAccount with RBAC",cmds:[
      {cmd:"kubectl create ns cicd-demo",why:"Isolated namespace for this demo."},
      {cmd:"kubectl create serviceaccount pipeline -n cicd-demo",why:"Machine identity for the CI/CD system."},
      {cmd:"kubectl create role pipeline-role -n cicd-demo --verb=get,list,watch,create,update,patch --resource=deployments,pods,replicasets,services",why:"Minimal permissions: can deploy and read but cannot delete."},
      {cmd:"kubectl create rolebinding pipeline-bind -n cicd-demo --role=pipeline-role --serviceaccount=cicd-demo:pipeline",why:"Binds role to the pipeline ServiceAccount."},
    ]},
    {title:"Automated deploy and verify",cmds:[
      {cmd:"kubectl create deployment app --image=nginx:1.24 --replicas=3 -n cicd-demo",why:"Simulates CI/CD deploying a new build."},

       keywords:["Kubernetes","K8s","cluster","node","container","image","registry","control plane","worker node","etcd","API Server","Scheduler","Controller Manager","kubelet","kube-proxy","CoreDNS","kubectl","reconciliation","container runtime","CNI"],
       explanation:`Before Kubernetes, teams ran apps in Docker containers manually. Fine for 2–3 containers — but imagine managing 200 containers across 10 servers. Who restarts a crashed container? Who moves it when a server dies? Who load-balances traffic? Kubernetes answers all of these.\n\nKubernetes (K8s) is an open-source container orchestration platform originally built by Google, now maintained by CNCF. Think of it as an operating system for your cluster — it decides WHERE containers run, WHEN to restart them, HOW MANY copies to keep, and HOW traffic reaches them.\n\nCLUSTER ARCHITECTURE — Two parts:\n\n• Control Plane (the brain): API Server is the single entry point — every kubectl command, every controller, every node talks through it. etcd is a distributed key-value store holding ALL cluster state — losing etcd means losing the cluster. The Scheduler watches for unscheduled Pods and assigns them to nodes based on available resources and constraints. The Controller Manager runs the reconciliation loop for every built-in controller.\n\n• Worker Nodes (the muscles): kubelet is an agent on every node — watches the API Server for Pod assignments and manages container lifecycle. kube-proxy runs on every node maintaining iptables rules so Service ClusterIPs route to real Pod IPs. The container runtime (containerd, CRI-O) actually starts and stops containers — Docker is no longer the default.\n\nRECONCILIATION LOOP: The heart of K8s — observe current state → compare to desired state → take action to close the gap. Every controller runs this continuously. If you want 3 replicas and one crashes, K8s creates a new one — automatically, without human intervention.\n\nWHY NOT JUST DOCKER COMPOSE? Compose is single-host. K8s spans many machines, survives node failures, manages networking across hosts, and auto-scales workloads.`,

      {title:"Pods — The Atomic Unit",
       keywords:["Pod","container","image","volume","emptyDir","hostPath","CrashLoopBackOff","ImagePullBackOff","OOMKilled","QoS class","sidecar","init container","manifest"],
       explanation:`A Pod is the smallest deployable unit in Kubernetes — NOT a container. A Pod wraps one or more containers sharing the same network namespace, storage volumes, and lifecycle. Containers inside a Pod communicate via localhost and share the same IP address.\n\nPOD LIFECYCLE STATES:\n• Pending → API Server accepted it but Scheduler hasn't placed it yet\n• ContainerCreating → Scheduled, image still pulling\n• Running → at least one container running\n• Succeeded → all containers exited with code 0\n• Failed → at least one container exited non-zero (restart policy Never)\n• Unknown → node lost contact with API Server\n\nCOMMON ERROR STATES:\n• CrashLoopBackOff → container keeps crashing; K8s restarts with exponential backoff (10s, 20s, 40s...)\n• ImagePullBackOff → K8s cannot pull the container image — wrong tag, private registry, or network issue\n• OOMKilled → container exceeded memory limit (exit code 137)\n• Evicted → node under pressure evicted the Pod\n\nVOLUMES: A volume is a directory accessible to containers in a Pod. emptyDir is temporary — shared between containers but deleted when Pod is removed. hostPath mounts from the host node's filesystem.\n\nMULTI-CONTAINER PATTERNS: Most Pods have one container. Multi-container Pods use Sidecar (log shipper alongside app), Init Container (setup before main app), or Ambassador (proxy pattern).\n\nKEY INSIGHT: Pods are EPHEMERAL. Never treat a Pod as permanent. Its IP changes every restart — exactly why we use Deployments and Services on top of raw Pods.`,

       explanation:`Every resource in Kubernetes can be described as a YAML manifest file. This is the DECLARATIVE approach — describe WHAT you want, K8s figures out HOW.\n\nEVERY K8s YAML has 4 required fields:\n• apiVersion → API group and version (v1 for core, apps/v1 for Deployments, batch/v1 for Jobs)\n• kind → resource type (Pod, Deployment, Service, ConfigMap...)\n• metadata → name, namespace, labels, annotations\n• spec → the desired state — different for every resource type\n\nIMPERATIVE vs DECLARATIVE:\n• Imperative: kubectl run, kubectl create — fast for one-off tasks, not version-controllable\n• Declarative: kubectl apply -f file.yaml — idempotent, Git-friendly, production-standard\n\nDRY-RUN: The CKA-standard way to create YAML — kubectl run nginx --image=nginx --dry-run=client -o yaml. Never write from scratch — generate and edit.\n\nJSONPATH: Extract specific fields — kubectl get pod nginx -o jsonpath='{.status.podIP}'. Used in scripts and CKA exam tasks.\n\nPORT-FORWARD: kubectl port-forward exposes a Pod or Service port locally for testing — no Service required.\n\nSELECTORS: Services find Pods via label selectors. Without matching labels, your Service routes to nothing.`,

       explanation:`A ReplicaSet ensures a specified number of Pod replicas are always running. It uses a selector to own its Pods and runs the reconciliation loop — if a Pod dies, it creates a new one immediately.\n\nA Deployment wraps a ReplicaSet and adds: update strategies, rollback capability, and declarative updates. A Deployment manages TWO ReplicaSets simultaneously during a rolling update — the old one scales down as the new one scales up.\n\nHOW ROLLING UPDATES WORK:\n1. You update the Deployment image\n2. K8s creates a NEW ReplicaSet with the new version\n3. Increases new RS by 1 (surge), waits for Pod Ready\n4. Decreases old RS by 1\n5. Repeats until old RS is at 0\n\nmaxSurge=1, maxUnavailable=0 → safest for production (never fewer than desired Pods)\nmaxSurge=25%, maxUnavailable=25% → default (faster, slight risk)\n\nSTRATEGIES:\n• RollingUpdate (default) → gradual replacement, zero downtime\n• Recreate → kills ALL old Pods first, then creates new (has downtime)\n\nROLLBACK: kubectl rollout undo reactivates the previous ReplicaSet — it's already there, just scaled to 0.`,

    assessment:{title:"L1 Foundation Quiz",questions:[

      {q:"A DaemonSet is best used for which workload type?",options:["Stateless web servers","One-time batch tasks","Agents that must run on every node","Databases"],answer:2,explain:"DaemonSet ensures exactly ONE Pod per node. Perfect for node-level agents like Fluentd, Prometheus node-exporter, or CNI plugins."},

      {title:"Services & Networking",keywords:["Service","ClusterIP","NodePort","LoadBalancer","ExternalName","CoreDNS","endpoint","kube-proxy","headless Service"],
       explanation:`Pods are ephemeral — they die and restart with new IP addresses. A Service provides a stable endpoint always routing to the correct Pods regardless of which specific Pod IPs are running.\n\nTHE 4 SERVICE TYPES:\n• ClusterIP → virtual IP inside cluster only. Default type. For internal microservice communication.\n• NodePort → opens a port (30000–32767) on every node. For dev/testing.\n• LoadBalancer → provisions a cloud load balancer (AWS ELB, GCE LB). For production public services.\n• ExternalName → maps to an external DNS name. For integrating outside services into cluster DNS.\n\nHEADLESS SERVICE: A Service with clusterIP: None gives each Pod its own DNS entry instead of a shared ClusterIP. Used by StatefulSets for stable pod identity.\n\nHOW TRAFFIC FLOWS:\nClient Pod → DNS lookup → CoreDNS returns ClusterIP → packet hits iptables → DNAT to Pod IP\n\nDNS: Every Service gets: service-name.namespace.svc.cluster.local\nSearch path allows short names within the same namespace.\n\nINSPECTING ENDPOINTS: The endpoint object contains actual Pod IPs behind a Service. If empty, selector matches no Pods — the most common Service bug.`,
       subtopics:["Why Services exist — the Pod IP problem","Label selectors — bridge between Service and Pod","ClusterIP, NodePort, LoadBalancer, ExternalName","Headless Service for StatefulSet identity","CoreDNS search path and FQDN","Endpoints object — the real routing table"],

      {title:"ConfigMaps & Secrets",keywords:["ConfigMap","Secret","ServiceAccount","annotation","volume"],
       explanation:`Hardcoding config inside images means rebuilding for every environment. Externalizing config follows 12-Factor App methodology.\n\nTWO WAYS TO CONSUME:\n1. Environment Variables — injected at Pod startup. Requires restart to update.\n2. Volume Mounts — mounted as files. Pod sees updated values after ~1 minute WITHOUT restart.\n\nWARNING: base64 is NOT encryption. Anyone with kubectl get secret can decode: kubectl get secret <name> -o jsonpath='{.data.key}' | base64 -d\n\nSECRET TYPES:\n• Opaque → generic key-value pairs (most common)\n• kubernetes.io/tls → TLS certificate and key\n• kubernetes.io/dockerconfigjson → registry credentials\n• kubernetes.io/service-account-token → auto-created for ServiceAccounts\n\nPRODUCTION: Use HashiCorp Vault, AWS Secrets Manager + External Secrets Operator, or Sealed Secrets (Bitnami) — not raw K8s Secrets alone.`,
       subtopics:["ConfigMap for non-sensitive config","Secret for sensitive data — base64 not encryption","Env vars vs volume mounts — when to use each","Secret types: Opaque, TLS, docker-registry","Immutable ConfigMaps for performance","Production: Vault, ESO, Sealed Secrets"],

         {cmd:"kubectl create secret tls my-tls --cert=tls.crt --key=tls.key",desc:"Creates a TLS Secret."},

       resources:[

      {title:"Persistent Storage",keywords:["PersistentVolume","PersistentVolumeClaim","StorageClass","StatefulSet","emptyDir","hostPath","volume","CSI"],
       explanation:`Containers are stateless by default — data written inside is lost when Pod is deleted.\n\nSTORAGE HIERARCHY:\n• volume → a directory accessible to containers. Backed by emptyDir, hostPath, PVC, ConfigMap, Secret, etc.\n• emptyDir → temporary. Shared between containers in the same Pod. Deleted when Pod removed.\n• hostPath → mounts from host node filesystem. Ties Pod to a node — dangerous in production.\n• PersistentVolume (PV) → cluster-level storage. Exists independently of any Pod.\n• PersistentVolumeClaim (PVC) → Pod's request for storage. K8s binds a matching PV.\n• StorageClass → defines storage type and provisioner. Enables dynamic provisioning via CSI.\n\nACCESS MODES:\n• ReadWriteOnce (RWO) → one node, read-write. For databases.\n• ReadOnlyMany (ROX) → many nodes, read-only.\n• ReadWriteMany (RWX) → many nodes, read-write. Requires NFS or cloud file storage.\n\nRECLAIM POLICIES:\n• Delete → PV deleted with PVC (default). Data GONE.\n• Retain → PV persists. Must be manually reclaimed. Safer for databases.`,

         {cmd:"kubectl get pvc",desc:"Lists PersistentVolumeClaims."},

         {cmd:"kubectl describe pvc my-pvc",desc:"Full PVC details including why it's Pending."},

       resources:[
         {title:"K8s Docs — Persistent Volumes",url:"https://kubernetes.io/docs/concepts/storage/persistent-volumes/"},
         {title:"K8s Docs — Storage Classes",url:"https://kubernetes.io/docs/concepts/storage/storage-classes/"},
       ]},
      {title:"Probes & Health Checks",keywords:["livenessProbe","readinessProbe","startupProbe","rolling update","endpoint"],
       explanation:`THREE PROBE TYPES — each causes a DIFFERENT action on failure:\n\n• livenessProbe → KILL AND RESTART the container. For deadlocks or frozen processes. Do NOT check external dependencies here.\n\n• readinessProbe → REMOVE from Service endpoints (no restart). Most important for zero-downtime. Check DB connection, cache loaded, etc. Without this, K8s sends traffic before your app is ready → 502s during deployments.\n\n• startupProbe → disables liveness and readiness while failing. Runs ONLY during startup. Once succeeds, never runs again. For slow-starting Java apps.\n\nTHREE MECHANISMS:\n• httpGet — HTTP GET; success = 200-399\n• exec — runs a command; success = exit code 0\n• tcpSocket — checks if TCP port is open\n\nKEY TIMING SETTINGS:\n• initialDelaySeconds — wait before first probe\n• periodSeconds — how often to check\n• failureThreshold — consecutive failures before action\n• timeoutSeconds — probe timeout`,
       subtopics:["livenessProbe: restart on deadlock","readinessProbe: gate traffic — most important","startupProbe: protect slow-starting apps","Mechanisms: httpGet, exec, tcpSocket","initialDelaySeconds, periodSeconds, failureThreshold","Zero-downtime deployments require readinessProbe"],
       commands:[
         {cmd:"kubectl describe pod <name> | grep -A15 Liveness",desc:"Shows liveness probe config and last result."},
         {cmd:"kubectl describe pod <name> | grep -A15 Readiness",desc:"Shows readiness probe config."},
         {cmd:"kubectl get events --sort-by=.lastTimestamp",desc:"Shows probe failures and restarts."},
       ],
       resources:[{title:"K8s Docs — Configure Probes",url:"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"}]},
      {title:"Resource Requests & Limits",keywords:["Resource Request","Resource Limit","QoS class","ResourceQuota","LimitRange","OOMKilled","Metrics Server"],
       explanation:`REQUESTS vs LIMITS:\n• Resource Request → GUARANTEED minimum. Scheduler uses this for placement. Container always gets at least this amount.\n• Resource Limit → MAXIMUM. CPU is THROTTLED at the limit. Memory: exceed = OOMKilled (exit code 137).\n\nCPU: 1 CPU = 1000 millicores. 500m = 0.5 cores.\nMEMORY: Always use Mi/Gi (mebibytes), not M/G.\n\nQoS CLASSES — assigned automatically, controls eviction order:\n• Guaranteed → requests equal limits for ALL containers. Last evicted.\n• Burstable → at least one container has requests or limits. Evicted before Guaranteed.\n• BestEffort → NO requests or limits set. First evicted. Never use in production.\n\nNAMESPACE CONTROLS:\n• LimitRange → sets default requests/limits AND bounds. Without this, Pods in quota-enforced namespaces with no limits are REJECTED.\n• ResourceQuota → hard caps per namespace. Prevents one team consuming all cluster resources.\n\nMetrics Server collects CPU/memory metrics from kubelets every 15s — required for kubectl top and HPA.`,
       subtopics:["Requests: scheduling guarantee vs Limits: enforcement","CPU throttling vs memory OOMKill (exit 137)","CPU millicores and memory Mi/Gi units","QoS classes: Guaranteed, Burstable, BestEffort","LimitRange: namespace defaults and bounds","ResourceQuota: total namespace caps"],
       commands:[
         {cmd:"kubectl top nodes",desc:"Real-time CPU/memory per node (needs Metrics Server)."},
         {cmd:"kubectl top pods --sort-by=cpu",desc:"Pods sorted by CPU usage."},
         {cmd:"kubectl describe resourcequota -n dev",desc:"Shows quota usage vs hard limits."},
         {cmd:"kubectl describe node <name> | grep -A10 Allocated",desc:"How much node capacity is allocated."},
       ],
       resources:[
         {title:"K8s Docs — Resource Management",url:"https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"},
         {title:"K8s Docs — Resource Quotas",url:"https://kubernetes.io/docs/concepts/policy/resource-quotas/"},
       ]},

    labs:[
      {title:"Lab 6: Service Mesh Lite",difficulty:"Medium",desc:"Deploy frontend (nginx) and backend (httpd). Create ClusterIP Services. Exec into frontend and reach backend by DNS name. Break backend Service selector and use kubectl get endpoints to diagnose. Fix it.",solution:"kubectl create deployment backend --image=httpd --replicas=2\nkubectl expose deployment backend --port=80 --name=backend-svc\nkubectl exec -it <pod> -- wget -qO- http://backend-svc\nkubectl patch svc backend-svc -p '{\"spec\":{\"selector\":{\"app\":\"wrong\"}}}'\nkubectl get endpoints backend-svc\nkubectl patch svc backend-svc -p '{\"spec\":{\"selector\":{\"app\":\"backend\"}}}'"},

      {title:"Lab 9: Probe Engineer",difficulty:"Hard",desc:"Deploy nginx with all three probes using httpGet on /. Set resource requests and limits. Then configure a livenessProbe with an unreachable path to watch the restart loop. Fix it.",solution:"kubectl apply -f probe-deploy.yaml\nkubectl rollout status deployment/probe-app\n# Patch liveness to broken path, watch RESTARTS increment\nkubectl get pod -w\nkubectl describe pod <name> | grep -A5 'Liveness'\n# Fix: restore path to /"},
      {title:"Lab 10: Resource Quota Enforcer",difficulty:"Hard",desc:"Create namespace 'team-a' with ResourceQuota: 4 pods, 1 CPU, 2Gi memory. Add a LimitRange with defaults. Deploy 5 replicas and observe the 5th rejection. Check quota usage. Reduce to fit within quota.",solution:"kubectl create ns team-a\nkubectl apply -f quota.yaml -n team-a\nkubectl apply -f limitrange.yaml -n team-a\nkubectl create deployment test --image=nginx --replicas=5 -n team-a\nkubectl get pods -n team-a\nkubectl describe resourcequota -n team-a\nkubectl scale deployment test --replicas=3 -n team-a"},
