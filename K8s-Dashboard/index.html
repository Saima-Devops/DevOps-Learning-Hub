    assessment:{title:"L2 Core Workloads Quiz",questions:[
      {q:"Service with selector app:backend has no endpoints. Most likely cause?",options:["Zero replicas","Pod labels don't match selector","Wrong service type","Different namespace"],answer:1,explain:"kubectl get endpoints shows none when selector doesn't match any Pod. Even a label case mismatch breaks it."},
      {q:"When does an env var from a ConfigMap update in a running Pod?",options:["Immediately","Only after Pod restarts","After ~1 minute","Never, must recreate"],answer:1,explain:"Env vars are injected at startup and never auto-updated. Volume-mounted ConfigMaps update after ~1 minute without restart."},
      {q:"What happens when a container exceeds its memory limit?",options:["Throttled until usage drops","Killed with OOMKilled (exit code 137)","K8s raises the limit automatically","Evicted gracefully with SIGTERM"],answer:1,explain:"Unlike CPU (throttled), memory has no throttle. The kernel OOM killer terminates the container immediately — exit code 137."},
      {q:"Which controller gives each Pod a stable name (pod-0, pod-1) with its own PVC?",options:["Deployment","ReplicaSet","DaemonSet","StatefulSet"],answer:3,explain:"StatefulSet provides stable Pod names, ordered startup/shutdown, and per-Pod PVCs via volumeClaimTemplates."},
      {q:"Your namespace ResourceQuota is 4 CPUs. Cluster has 16 free CPUs but new Pod stays Pending. Why?",options:["Node capacity issue","Namespace quota exhausted","Scheduler is down","Image cannot pull"],answer:1,explain:"ResourceQuota caps at namespace level regardless of cluster capacity. If existing Pods use 3 CPUs and new Pod requests 2, it exceeds the 4 CPU quota."},
      {q:"What is the purpose of a headless Service (clusterIP: None)?",options:["Disables the Service","Gives each Pod a direct DNS entry instead of routing through a ClusterIP","Makes the Service externally accessible","Removes Service from iptables"],answer:1,explain:"Headless Services with clusterIP: None give each Pod its own DNS record. Used by StatefulSets for stable pod identity."},
      {q:"Which readinessProbe failure does NOT cause a Pod restart?",options:["httpGet failure","exec failure","tcpSocket failure","None — all readiness failures cause restarts"],answer:3,explain:"readinessProbe failure removes the Pod from Service endpoints — traffic stops — but the Pod is NOT restarted. Only livenessProbe causes restart."},
      {q:"A PVC stays in Pending state. What is the most likely cause?",options:["The Pod is not running","No PV matches the access mode or storage size","The namespace has no StorageClass quota","Invalid PVC name"],answer:1,explain:"PVC stays Pending when no PV matches AND no StorageClass can dynamically provision one. kubectl describe pvc shows the exact reason."},
      {q:"What QoS class does a Pod get when requests equal limits for all containers?",options:["BestEffort","Burstable","Guaranteed","Premium"],answer:2,explain:"Guaranteed = requests equal limits for ALL containers. These are LAST to be evicted under node memory pressure."},
      {q:"What does kubectl expose deployment app --port=80 --type=LoadBalancer do?",options:["Creates an Ingress","Provisions a cloud load balancer mapped to the app's pods","Makes the app available on a NodePort only","Adds a ClusterIP Service"],answer:1,explain:"LoadBalancer type triggers the cloud provider to provision a load balancer (AWS ELB, GCP LB). Gets an external IP assigned."},
      {q:"A StatefulSet has 3 replicas. You scale down to 1. In what order are Pods terminated?",options:["Randomly","pod-0 first","pod-2 first (reverse order)","All simultaneously"],answer:2,explain:"StatefulSets scale down in reverse ordinal order (pod-2, then pod-1) to protect data integrity."},
      {q:"What is the difference between emptyDir and PersistentVolumeClaim?",options:["No difference","emptyDir is deleted when the Pod is removed; PVC persists independently","emptyDir requires StorageClass; PVC does not","PVC is only for StatefulSets"],answer:1,explain:"emptyDir lives and dies with the Pod. PVC is bound to a PV that exists independently — data survives Pod deletion."},
      {q:"You want K8s to automatically manage TLS certificates from Let's Encrypt. What tool do you use?",options:["kubectl tls","cert-manager","Secrets Controller","Ingress TLS auto"],answer:1,explain:"cert-manager automates TLS certificate provisioning from Let's Encrypt, Vault, or other issuers based on Ingress annotations or Certificate CRDs."},
      {q:"Which Service type should you use for internal microservice-to-microservice communication?",options:["NodePort","LoadBalancer","ExternalName","ClusterIP"],answer:3,explain:"ClusterIP (default) creates a virtual IP reachable only inside the cluster. No external exposure, no cloud costs."},
      {q:"What does LimitRange enforce in a namespace?",options:["Maximum number of Services","Default resource requests/limits for Pods that don't set their own","Total CPU/memory across the entire namespace","Network bandwidth per Pod"],answer:1,explain:"LimitRange sets default requests and limits (applied automatically) and min/max bounds (rejected if exceeded)."},
    ]}

    topics:[
      {title:"RBAC & Security",keywords:["RBAC","Role","ClusterRole","RoleBinding","ServiceAccount","NetworkPolicy","taint","toleration","nodeAffinity","CRD","Operator"],
       explanation:`CORE RBAC OBJECTS:\n• ServiceAccount → machine identity for a Pod. Auto-mounted at /var/run/secrets/kubernetes.io/serviceaccount/token.\n• Role → WHAT actions (verbs) on WHAT resources within ONE NAMESPACE.\n• ClusterRole → same but cluster-wide or for non-namespaced resources (nodes, PVs, CRDs).\n• RoleBinding → connects a Role or ClusterRole to a subject in ONE namespace.\n• ClusterRoleBinding → connects a ClusterRole cluster-wide.\n\nVERBS: get, list, watch (read), create, update, patch (write), delete, * (all)\n\nPRINCIPLE OF LEAST PRIVILEGE: Use Roles (namespace-scoped) by default. Only ClusterRole when truly needed.\n\nSECURITY CONTEXTS:\n• runAsNonRoot: true → cannot run as root\n• readOnlyRootFilesystem: true → cannot write to filesystem\n• allowPrivilegeEscalation: false → child cannot gain more privileges\n\nNETWORK POLICIES: By default all Pods can reach all Pods. Require a CNI plugin that supports them (Calico, Cilium — NOT Flannel alone).\n\nPOD SECURITY STANDARDS (replaces PSP in K8s 1.25+):\n• Privileged, Baseline, Restricted\n\nCRDs and Operators: CRDs extend the K8s API with custom resource types. Operators package operational knowledge using CRDs and custom controllers.`,
       subtopics:["ServiceAccount: pod identity and auto-mounted token","Role vs ClusterRole scope","RoleBinding and ClusterRoleBinding","Security Contexts: runAsNonRoot, readOnlyRootFilesystem","NetworkPolicy — CNI requirements","Pod Security Standards: Privileged, Baseline, Restricted","CRDs and Operators"],
       commands:[
         {cmd:"kubectl auth can-i create pods --as=dev-user",desc:"Tests if dev-user can create pods."},
         {cmd:"kubectl auth can-i --list --as=alice",desc:"Lists ALL permissions for alice."},
         {cmd:"kubectl create role pod-reader --verb=get,list,watch --resource=pods",desc:"Creates a read-only role."},
         {cmd:"kubectl create rolebinding rb --role=pod-reader --user=alice -n dev",desc:"Binds Role to user in namespace."},
         {cmd:"kubectl get rolebindings,clusterrolebindings -A",desc:"Security audit — all role bindings."},
       ],
       resources:[
         {title:"K8s Docs — RBAC Authorization",url:"https://kubernetes.io/docs/reference/access-authn-authz/rbac/"},
         {title:"K8s Docs — Network Policies",url:"https://kubernetes.io/docs/concepts/services-networking/network-policies/"},
       ]},
      {title:"Ingress & Traffic Management",keywords:["Ingress","Ingress Controller","Service","ClusterIP","LoadBalancer","CoreDNS","topology"],
       explanation:`LoadBalancer = one cloud load balancer per Service — expensive at scale. Ingress solves this: ONE entry point for ALL Services.\n\nTWO SEPARATE COMPONENTS:\n• Ingress Controller → running Pod (nginx, Traefik, Kong) that watches Ingress objects. Must be deployed SEPARATELY.\n• Ingress Object → your YAML with routing rules. Does NOTHING without a Controller.\n\nROUTING TYPES:\n• Path-based → example.com/api → api-svc, example.com/ → frontend-svc\n• Host-based → api.example.com → api-svc, app.example.com → frontend-svc\n\nPATH TYPES: Exact, Prefix (most common), ImplementationSpecific.\n\nTLS TERMINATION: Ingress handles HTTPS. Reference a TLS Secret. Traffic inside cluster remains HTTP.\n\nINGRESSCLASS: Allows multiple Ingress Controllers. Set spec.ingressClassName: nginx to target specifically.\n\ncert-manager: Automates TLS certificates from Let's Encrypt.`,
       subtopics:["Ingress Controller vs Ingress Object — must deploy both","Path-based and host-based routing","Path types: Exact, Prefix, ImplementationSpecific","TLS termination and TLS Secrets","IngressClass — multiple controllers","cert-manager for automatic TLS"],
       commands:[
         {cmd:"kubectl get ingress",desc:"Lists Ingress resources with hosts and backends."},
         {cmd:"kubectl describe ingress my-ingress",desc:"Full Ingress config including routing rules."},
         {cmd:"kubectl get ingressclass",desc:"Lists available Ingress Controllers."},
         {cmd:"helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace",desc:"Installs nginx Ingress Controller."},
       ],
       resources:[
         {title:"K8s Docs — Ingress",url:"https://kubernetes.io/docs/concepts/services-networking/ingress/"},
         {title:"nginx Ingress Controller Docs",url:"https://kubernetes.github.io/ingress-nginx/"},
       ]},
      {title:"Horizontal & Vertical Autoscaling",keywords:["HPA","Metrics Server","KEDA","Cluster Autoscaler","Pod","Deployment","PodDisruptionBudget"],
       explanation:`THREE SCALING DIMENSIONS:\n\n• HPA — adds/removes Pod REPLICAS.\nFORMULA: desiredReplicas = ceil(currentReplicas × (currentMetric / targetMetric))\nExample: 4 replicas at 80% CPU, target 50%: ceil(4 × 1.6) = 7\nScale-up is fast. Scale-down uses a 5-minute stabilization window to prevent flapping.\n\n• VPA — adjusts CPU/memory REQUESTS based on actual usage. WARNING: Do NOT combine with HPA on CPU — they conflict.\n\n• KEDA — extends HPA with 60+ event-driven scalers: Kafka lag, SQS depth, HTTP rate, Prometheus, cron.\n\n• Cluster Autoscaler — adds/removes NODES. Adds when Pods stay Pending 2+ minutes. Removes underutilized nodes.\n\nPodDisruptionBudget (PDB) — guarantees minimum Pods available during voluntary disruptions (node drain, cluster upgrades).\n\nPREREQUISITE: Metrics Server must be installed for kubectl top and standard HPA to work.`,
       subtopics:["HPA formula: desiredReplicas = ceil(current × ratio)","5-minute scale-down stabilization window","Metrics Server: required for HPA","VPA: right-sizing and restart implications","KEDA: 60+ event-driven scalers","Cluster Autoscaler: node-level scaling","PodDisruptionBudget for maintenance safety"],
       commands:[
         {cmd:"kubectl autoscale deployment app --cpu-percent=50 --min=2 --max=10",desc:"Creates HPA targeting 50% CPU."},
         {cmd:"kubectl get hpa -w",desc:"Watches HPA scale in real-time."},
         {cmd:"kubectl describe hpa app",desc:"Full HPA details including scaling events."},
         {cmd:"kubectl top pods --sort-by=cpu",desc:"Lists pods sorted by CPU usage."},
       ],
       resources:[
         {title:"K8s Docs — Horizontal Pod Autoscaling",url:"https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"},
         {title:"KEDA — Kubernetes Event-driven Autoscaling",url:"https://keda.sh/"},
       ]},
      {title:"Helm — The Package Manager",keywords:["Helm","Namespace","ConfigMap","Secret","Deployment","label","annotation","CRD"],
       explanation:`Without Helm, deploying a complex app means dozens of raw YAML files with no versioning or rollback.\n\nCHART STRUCTURE:\n  mychart/\n    Chart.yaml     → name, version, appVersion\n    values.yaml    → default configuration\n    templates/     → YAML + Go template syntax\n    charts/        → subcharts\n\nTEMPLATE SYNTAX:\n• {{ .Values.replicaCount }} → from values.yaml\n• {{ .Release.Name }} → release name\n• {{ if .Values.ingress.enabled }} ... {{ end }} → conditional\n• {{ range .Values.env }} ... {{ end }} → loop\n\nVALUES HIERARCHY:\n1. Chart defaults (values.yaml)\n2. User values file (-f custom.yaml)\n3. --set flags (highest priority)\n\nBEST PRACTICES:\n• helm upgrade --install → idempotent, CI/CD safe\n• --atomic → auto-rollback if upgrade fails\n• helm template → preview YAML before deploying\n• helm lint → validate chart syntax`,
       subtopics:["Chart structure: Chart.yaml, values.yaml, templates/","Go template: Values, Release, conditionals, loops","Values hierarchy: defaults → user file → --set","Lifecycle: install, upgrade, rollback, uninstall","--atomic for safe upgrades in CI/CD","helm template for preview before deploy"],
       commands:[
         {cmd:"helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update",desc:"Adds Bitnami repo."},
         {cmd:"helm install myapp bitnami/nginx -f values.yaml",desc:"Installs chart with custom values."},
         {cmd:"helm upgrade --install myapp bitnami/nginx --atomic",desc:"Idempotent install/upgrade with auto-rollback."},
         {cmd:"helm list -A",desc:"Lists all releases across all namespaces."},
         {cmd:"helm history myapp",desc:"Shows all revisions of a release."},
         {cmd:"helm template ./mychart",desc:"Renders YAML without installing."},
       ],
       resources:[
         {title:"Helm Docs",url:"https://helm.sh/docs/"},
         {title:"Artifact Hub — Find Helm Charts",url:"https://artifacthub.io/"},
       ]},
    ],
    labs:[
      {title:"Lab 11: RBAC Lockdown",difficulty:"Hard",desc:"Create dev, staging, prod namespaces. Create a developer Role in dev with full Pod/Deployment access. Create a readonly ClusterRole bound to user 'viewer'. Create ServiceAccount cicd-bot in staging with deploy-only access. Verify all three with kubectl auth can-i.",solution:"kubectl create role dev-role -n dev --verb=get,list,watch,create,update,patch --resource=deployments,pods\nkubectl create clusterrole viewer --verb=get,list,watch --resource='*'\nkubectl create clusterrolebinding viewer-binding --clusterrole=viewer --user=viewer\nkubectl create sa cicd-bot -n staging\nkubectl auth can-i create deployments -n dev --as=developer\nkubectl auth can-i delete deployments -n staging --as=system:serviceaccount:staging:cicd-bot"},
      {title:"Lab 12: Ingress Controller Setup",difficulty:"Hard",desc:"Install nginx-ingress via Helm. Deploy two apps (app-a: nginx, app-b: httpd). Expose as ClusterIP Services. Create an Ingress routing /app-a and /app-b. Test with curl. Add TLS using a self-signed cert Secret.",solution:"helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace\nkubectl apply -f ingress.yaml\nkubectl describe ingress my-ingress\ncurl http://<node-ip>/app-a\nopenssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj '/CN=example.com'\nkubectl create secret tls my-tls --cert=tls.crt --key=tls.key"},
      {title:"Lab 13: Auto-Scaling Under Load",difficulty:"Hard",desc:"Install Metrics Server. Deploy hpa-example image with CPU requests. Create HPA targeting 50% CPU. Run load generator Pod. Watch HPA scale from 2 to 8 replicas. Stop load and watch scale-down.",solution:"kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml\nkubectl create deployment loadtest --image=registry.k8s.io/hpa-example\nkubectl set resources deployment loadtest --requests=cpu=200m\nkubectl autoscale deployment loadtest --cpu-percent=50 --min=2 --max=10\nkubectl run load-gen --image=busybox --restart=Never -- sh -c 'while true; do wget -q -O- http://loadtest; done'\nkubectl get hpa -w"},
      {title:"Lab 14: Helm Deploy & Rollback",difficulty:"Hard",desc:"Add Bitnami repo. Install nginx chart with replicaCount=2. Upgrade with a bad image tag. Observe the failure. Roll back to revision 1. View full release history.",solution:"helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update\nhelm install my-nginx bitnami/nginx --set replicaCount=2 -n helm-demo --create-namespace\nhelm upgrade my-nginx bitnami/nginx --set image.tag=broken -n helm-demo\nkubectl get pods -n helm-demo\nhelm rollback my-nginx 1 -n helm-demo\nhelm history my-nginx -n helm-demo"},
      {title:"Lab 15: NetworkPolicy Zero-Trust",difficulty:"Hard",desc:"Create namespace 'secure'. Deploy frontend, api, and db pods. Apply a default-deny NetworkPolicy. Add policies: frontend→api port 80, api→db port 5432. Verify frontend cannot reach db.",solution:"kubectl create ns secure\nkubectl apply -f default-deny.yaml -n secure\nkubectl exec -it <frontend-pod> -n secure -- wget -qO- http://api --timeout=3  # FAILS\nkubectl apply -f allow-frontend-api.yaml -n secure\nkubectl exec -it <frontend-pod> -n secure -- wget -qO- http://api  # SUCCESS\nkubectl exec -it <frontend-pod> -n secure -- wget -qO- http://db --timeout=3  # FAILS"},
    ],
    assessment:{title:"L3 Production Grade Quiz",questions:[
      {q:"Developer needs to create Deployments in staging only. Which RBAC combination is correct?",options:["ClusterRole + ClusterRoleBinding","Role + RoleBinding in staging namespace","ClusterRoleBinding to staging namespace only","ServiceAccount with admin ClusterRole"],answer:1,explain:"Role (not ClusterRole) is namespace-scoped. RoleBinding in staging grants access only there."},
      {q:"Ingress routes /api to service-a but returns 404. First thing to check?",options:["TLS Secret is configured","Ingress Controller Pod is running","Service type is ClusterIP","NetworkPolicy blocking port 443"],answer:1,explain:"Ingress objects do nothing without a Controller. kubectl get pods -n ingress-nginx is always the first diagnostic step."},
      {q:"HPA: target CPU 50%, currently 4 replicas at 80% CPU. New replica count?",options:["5","6","7","8"],answer:2,explain:"ceil(4 × (80/50)) = ceil(6.4) = 7. K8s always rounds UP (ceiling) on scale-out."},
      {q:"Which Helm command is safe for both install and upgrade in CI/CD pipelines?",options:["helm install --force","helm deploy --upsert","helm upgrade --install","helm apply"],answer:2,explain:"helm upgrade --install installs if not exists, upgrades if it does. Idempotent and CI/CD safe."},
      {q:"API Pods must NEVER share the same node. Which feature enforces this?",options:["Node Affinity required","Pod Anti-Affinity with topologyKey: kubernetes.io/hostname","Taints on all nodes","Topology Spread maxSkew: 0"],answer:1,explain:"Pod Anti-Affinity with requiredDuringScheduling and topologyKey: kubernetes.io/hostname ensures each replica lands on a different node."},
      {q:"A node has taint key=value:NoSchedule. How do you allow a specific Pod to run on it?",options:["Add nodeSelector to the Pod","Add a toleration matching key=value:NoSchedule to the Pod","Remove the taint before deploying","Use a ClusterRole to override the taint"],answer:1,explain:"Tolerations allow a Pod to be scheduled onto nodes with matching taints. Without toleration, Scheduler ignores the tainted node."},
      {q:"What does helm upgrade --atomic do differently from a regular upgrade?",options:["Upgrades atomically — all resources or none","Auto-rolls back if any Pod is not ready after upgrade","Prevents concurrent upgrades","Locks the release for exclusive access"],answer:1,explain:"--atomic waits for upgrade to succeed (all Pods ready). If it fails or times out, Helm automatically rolls back."},
      {q:"What is the default scale-down stabilization window for HPA?",options:["30 seconds","1 minute","5 minutes","15 minutes"],answer:2,explain:"HPA waits 5 minutes of stable low metrics before scaling down — prevents rapid oscillations ('flapping')."},
      {q:"You apply a default-deny NetworkPolicy. Which traffic is immediately affected?",options:["Only new Pods","All Pod-to-Pod traffic in the namespace blocked immediately","Only egress — ingress still works","Only traffic from outside the cluster"],answer:1,explain:"NetworkPolicies apply immediately to all matching Pods. Empty podSelector matches ALL Pods — both existing and new."},
      {q:"What is the difference between kubectl cordon and kubectl drain?",options:["They are identical","cordon prevents new pods; drain also evicts existing pods","drain prevents new pods; cordon evicts existing pods","cordon is for nodes; drain is for namespaces"],answer:1,explain:"cordon marks SchedulingDisabled (no new Pods) but existing keep running. drain also evicts all existing Pods (respecting PDBs)."},

    "nodeSelector is the simplest hard constraint on node labels. Node affinity offers the same thing with richer operators."),
  Q(2,2,0,"What does requiredDuringSchedulingIgnoredDuringExecution mean in node affinity?",
    "The rule must be met when the Pod is scheduled, but the Pod is not evicted if node labels change later",
    ["The rule is a preference the scheduler may ignore","The rule is checked continuously and Pods are evicted when it fails","The rule applies only to Pods created by a Job"],
    "The required part is a hard scheduling filter. IgnoredDuringExecution means running Pods stay put. preferredDuringScheduling... is the soft version."),
  Q(2,1,1,"How do you create ConfigMap app-cfg from the local file app.properties?",
    "kubectl create configmap app-cfg --from-file=app.properties",
    ["kubectl create configmap app-cfg --from-literal=app.properties","kubectl apply configmap app-cfg -f app.properties","kubectl create secret generic app-cfg --from-file=app.properties"],
    "--from-file stores the file under a key named after the file. --from-literal is for key=value pairs."),
  Q(2,1,1,"How do you expose every key of ConfigMap app-cfg as environment variables in a container?",
    "Use envFrom with a configMapRef to app-cfg",
    ["Use env with valueFrom.configMapKeyRef and no key","Mount app-cfg at /etc/env","Set spec.configMap: app-cfg"],
    "envFrom imports all keys at once. env[].valueFrom.configMapKeyRef pulls a single named key."),
  Q(2,1,1,"You update a ConfigMap that a running Pod consumes as environment variables. When does the container see the new values?",
    "Only after the Pod is restarted or recreated",
    ["Immediately","Within about a minute, through the kubelet sync","Never, because ConfigMaps are immutable"],
    "Environment variables are set when the container starts. Volume-mounted ConfigMaps (not using subPath) are refreshed in place after a short delay."),
  Q(2,1,4,"Which resources settings give a Pod the Guaranteed QoS class?",
    "Every container sets CPU and memory limits, with requests equal to those limits",
    ["Every container sets requests but no limits","At least one container sets a memory limit","No container sets any requests or limits"],
    "Guaranteed needs requests equal to limits for both CPU and memory in every container. Setting only some values gives Burstable; setting none gives BestEffort."),
  Q(2,1,4,"What does a LimitRange do in a namespace?",
    "Sets default and min/max requests and limits for each container or Pod",
    ["Caps the total CPU and memory all Pods in the namespace can use","Limits how many namespaces a user can create","Rate-limits API requests from the namespace"],
    "LimitRange works per container or Pod and injects defaults. ResourceQuota caps the namespace's total usage."),
  Q(2,2,2,"Which command creates an HPA that keeps Deployment web between 2 and 8 replicas at 60% average CPU?",
    "kubectl autoscale deployment web --cpu-percent=60 --min=2 --max=8",
    ["kubectl scale deployment web --auto --min=2 --max=8","kubectl create hpa web --target=60","kubectl set autoscale deployment/web 2-8 60%"],
    "kubectl autoscale creates a HorizontalPodAutoscaler. The Pods need CPU requests, and Metrics Server must be running."),
  Q(2,2,2,"An HPA shows <unknown>/60% as its target. What are the two most likely causes?",
    "Metrics Server is not running, or the target Pods have no CPU requests",
    ["The Deployment has too few replicas, or the HPA is in the wrong namespace","The node has a NoSchedule taint, or the image is too large","kube-proxy is down, or the Service has no endpoints"],
    "Utilisation is measured against requests, so Pods without CPU requests cannot be scaled on CPU percentage. Without Metrics Server there is no data at all."),
  Q(2,0,1,"A log agent must run exactly one Pod on every node, including nodes added later. Which workload fits?",
    "DaemonSet",
    ["Deployment with replicas equal to the node count","StatefulSet","Job with parallelism set to the node count"],
    "A DaemonSet schedules one Pod per eligible node and adds Pods automatically as nodes join."),
  Q(2,0,1,"A backup task must run every night at 02:00. Which object and schedule do you use?",
    "A CronJob with schedule \"0 2 * * *\"",
    ["A Job with schedule \"0 2 * * *\"","A Deployment with restartPolicy: Daily","A CronJob with schedule \"2 0 * * *\""],
    "CronJob uses standard cron syntax: minute, hour, day of month, month, day of week. \"0 2 * * *\" means minute 0 of hour 2. \"2 0 * * *\" would be 00:02."),
  Q(2,0,1,"How do init containers behave?",
    "They run one at a time, each to completion, before the app containers start",
    ["They run alongside the app containers for the Pod's lifetime","They run after the app containers exit","They run only when the Pod is restarted"],
    "Each init container must exit successfully before the next starts. A failing init container keeps the Pod in Init state."),
  Q(2,0,1,"On recent Kubernetes versions (1.29+), how do you declare a native sidecar container that starts before and outlives the app container?",
    "As an entry in initContainers with restartPolicy: Always",
    ["In a separate spec.sidecars list","With the annotation sidecar=true","As a container with lifecycle.type: sidecar"],
    "An init container with restartPolicy: Always starts before the main containers, keeps running, and is stopped after them."),
  Q(2,2,0,"A high-priority Pod cannot be scheduled because the cluster is full. What can a PriorityClass allow the scheduler to do?",
    "Evict lower-priority Pods to make room (preemption)",
    ["Add a new node automatically","Ignore the Pod's resource requests","Run the Pod on a control plane node despite its taint"],
    "Pods with a higher priority can preempt lower-priority Pods. Adding nodes is the Cluster Autoscaler's job."),
  Q(2,0,4,"Which command scales Deployment web to 5 replicas?",
    "kubectl scale deployment web --replicas=5",
    ["kubectl resize deployment web 5","kubectl set replicas deployment/web 5","kubectl autoscale deployment web --replicas=5"],
    "kubectl scale changes spec.replicas directly. If an HPA manages the Deployment it will override manual changes."),

  // ── Domain 3: Services & Networking ──
  Q(3,1,0,"Which command exposes Deployment web on port 80 through a NodePort Service?",
    "kubectl expose deployment web --type=NodePort --port=80",
    ["kubectl create service web --nodeport 80","kubectl expose pod web --port=30080 --external","kubectl port-forward deployment/web 80"],
    "expose copies the Deployment's selector into a new Service. Kubernetes picks a node port in the 30000-32767 range unless you set one."),
  Q(3,1,0,"What is the default port range for NodePort Services?",
    "30000-32767",
    ["1-1024","8000-9000","20000-29999"],
    "The range is set by the API server flag --service-node-port-range and defaults to 30000-32767."),
  Q(3,1,0,"Service api lives in namespace prod. What is its fully qualified DNS name with the default cluster domain?",
    "api.prod.svc.cluster.local",
    ["prod.api.svc.cluster.local","api.svc.prod.cluster.local","api.cluster.local/prod"],
    "The pattern is <service>.<namespace>.svc.<cluster-domain>. Pods in prod can use just api; others need at least api.prod."),
  Q(3,1,0,"In a Service spec, what is the difference between port and targetPort?",
    "port is the port the Service listens on; targetPort is the port on the Pods that traffic is sent to",
    ["port is the node port; targetPort is the ClusterIP port","They must always be the same value","targetPort is used only for UDP"],
    "Clients connect to the Service on port; kube-proxy forwards to targetPort on the selected Pods. A wrong targetPort gives connection refused even though endpoints exist."),
  Q(3,1,0,"What does a headless Service (clusterIP: None) do?",
    "Returns the individual Pod IPs in DNS instead of a single virtual IP",
    ["Blocks all traffic to the Pods","Exposes the Pods on every node's IP","Creates a load balancer without a DNS name"],
    "With no ClusterIP, DNS returns A records for each ready Pod. StatefulSets use this to give each Pod a stable name such as web-0.web."),
  Q(3,1,0,"Which component programs the node rules that send traffic for a Service's ClusterIP to backend Pods (unless the CNI replaces it)?",
    "kube-proxy",
    ["kubelet","CoreDNS","kube-scheduler"],
    "kube-proxy runs on every node and maintains iptables or IPVS rules for Services. Some CNIs, such as Cilium, can replace it with eBPF."),
  Q(3,1,0,"What does a Service of type ExternalName do?",
    "Returns a DNS CNAME pointing to an external hostname",
    ["Assigns the Service a public IP","Proxies traffic through kube-proxy to an external IP","Exposes the Service on every node's external interface"],
    "ExternalName has no selector or ClusterIP. CoreDNS simply answers with a CNAME to the name in spec.externalName."),
  Q(3,1,0,"On a bare-metal cluster, a LoadBalancer Service stays at EXTERNAL-IP <pending>. Why?",
    "Nothing in the cluster implements LoadBalancer Services, such as a cloud controller or MetalLB",
    ["LoadBalancer Services need an Ingress first","The Service selector is wrong","NodePort is disabled"],
    "Cloud providers fulfil LoadBalancer Services. On bare metal you need something like MetalLB. The Service still works as a NodePort meanwhile."),
  Q(3,2,0,"Which NetworkPolicy blocks all incoming traffic to every Pod in its namespace?",
    "podSelector: {} with policyTypes: [Ingress] and no ingress rules",
    ["podSelector: {} with ingress: [{}]","policyTypes: [Egress] with no egress rules","podSelector: {deny: all}"],
    "An empty podSelector selects every Pod. Listing Ingress with no rules allows nothing in. ingress: [{}] would allow everything instead."),
  Q(3,2,0,"You applied a correct NetworkPolicy but traffic is still allowed. What is the most likely cause?",
    "The cluster's CNI plugin does not enforce NetworkPolicy",
    ["NetworkPolicies take 24 hours to apply","The policy must be in kube-system","NetworkPolicies only work with NodePort Services"],
    "The API server accepts NetworkPolicy objects regardless. Enforcement comes from the CNI; Calico and Cilium enforce it, while basic Flannel does not."),
  Q(3,2,0,"In a NetworkPolicy, one from entry contains both a namespaceSelector and a podSelector. What does it allow?",
    "Pods matching the podSelector inside namespaces matching the namespaceSelector",
    ["Any Pod matching either selector","Only Pods in the policy's own namespace","Nothing; combining them is invalid"],
    "Inside a single entry the selectors are combined with AND. Writing them as two separate list items (two dashes) would combine them with OR, which is a classic exam trap."),
  Q(3,2,0,"After applying a default-deny egress policy, Pods can no longer resolve Service names. What must you allow?",
    "Egress to the kube-dns Pods on port 53 for UDP and TCP",
    ["Ingress from the API server on port 6443","Egress to the node on port 10250","Ingress from CoreDNS on port 8080"],
    "DNS lookups are egress traffic too. Add a rule allowing port 53 to the CoreDNS Pods in kube-system."),
  Q(3,2,0,"Two NetworkPolicies select the same Pod. One allows traffic from app=web, the other from app=api. What is allowed?",
    "Traffic from both app=web and app=api",
    ["Only the policy created last applies","Only traffic matching both policies","Nothing, because the policies conflict"],
    "NetworkPolicies are additive allow-lists. There are no deny rules, so the allowed set is the union of all policies selecting the Pod."),
  Q(3,2,1,"You created an Ingress resource but nothing answers on its host. kubectl get ingress shows no address. What is the most likely cause?",
    "No Ingress controller is installed, or none matches the Ingress class",
    ["Ingress resources need a NodePort Service of type Ingress","The Ingress must be in kube-system","DNS for the host must be created inside the cluster first"],
    "An Ingress object is just configuration. A controller, such as ingress-nginx, must watch it and serve traffic."),
  Q(3,2,1,"An Ingress rule uses path /api with pathType: Prefix. Which request path does it match?",
    "/api/v1/users",
    ["/apiv1","/v1/api","/application"],
    "Prefix matching works on path elements split by /. /api matches /api and /api/... but not /apiv1. Exact would match /api only."),
  Q(3,2,1,"An Ingress terminates TLS. What must its tls section reference?",
    "A Secret of type kubernetes.io/tls in the same namespace as the Ingress",
    ["A ConfigMap containing the certificate","A Secret in kube-system","The certificate file path on the node"],
    "Create it with kubectl create secret tls <name> --cert=... --key=... in the Ingress's namespace and list it under spec.tls."),
  Q(3,2,1,"Two Ingress controllers run in the cluster. How does an Ingress choose which one serves it?",
    "spec.ingressClassName names the IngressClass of the intended controller",
    ["The controller with the lowest Pod IP wins","By the Ingress's namespace","With a label controller=<name> on the backend Service"],
    "Each controller owns an IngressClass. Without ingressClassName the default IngressClass, if any, is used."),
  Q(3,2,1,"In the Gateway API, which resource holds the routing rules (hosts, paths, backends) and attaches to a Gateway?",
    "HTTPRoute",
    ["GatewayClass","IngressClass","EndpointSlice"],
    "GatewayClass names the controller, Gateway defines the listeners, and route resources such as HTTPRoute attach to a Gateway and send traffic to Services."),
  Q(3,2,1,"In the Gateway API, which resource is cluster-scoped and identifies the controller that implements Gateways?",
    "GatewayClass",
    ["HTTPRoute","Gateway","ReferenceGrant"],
    "GatewayClass works like IngressClass. Infrastructure teams usually own it, platform teams create Gateways, and app teams create routes."),
  Q(3,1,0,"How does a Pod know which DNS server to query for Service names?",
    "Its /etc/resolv.conf points to the ClusterIP of the kube-dns Service, set by the kubelet",
    ["Each Pod runs its own CoreDNS sidecar","It queries etcd directly","It uses the node's public DNS resolver only"],
    "With the default ClusterFirst DNS policy the kubelet writes the cluster DNS IP and search domains into each container's resolv.conf."),
  Q(3,1,0,"Which one-liner is a quick way to test DNS resolution of Service api.prod from inside the cluster?",
    "kubectl run tmp --image=busybox:1.36 --rm -it --restart=Never -- nslookup api.prod",
    ["kubectl dns api.prod","kubectl exec svc/api -- nslookup api.prod","kubectl get dns api.prod -o wide"],
    "A throwaway busybox Pod gives you a client inside the Pod network. --rm deletes it when the command exits."),
  Q(3,1,0,"You need to reach Service web (port 80) from your workstation without exposing it. Which command works?",
    "kubectl port-forward svc/web 8080:80",
    ["kubectl expose svc/web --local 8080","kubectl proxy svc/web 80","kubectl tunnel web 8080:80"],
    "port-forward tunnels local port 8080 to port 80 of a Pod behind the Service through the API server, which is handy for debugging."),
  Q(3,1,0,"Which statement describes the Kubernetes network model?",
    "Every Pod gets its own IP and can reach every other Pod without NAT",
    ["Pods share the node's IP and use port mapping","Pods can only talk to Pods on the same node","Pods need a Service to talk to each other at all"],
    "The CNI plugin implements this flat network, assigning Pod IPs and routing between nodes. NetworkPolicy then restricts it."),
  Q(3,1,0,"Where does Kubernetes track the actual backend Pod addresses for a Service in current versions?",
    "In EndpointSlice objects linked to the Service",
    ["In the Service's status.podIPs field","In a ConfigMap in kube-system","In CoreDNS's Corefile"],
    "The EndpointSlice controller keeps the list of ready Pod IPs and ports. kubectl get endpointslices -l kubernetes.io/service-name=<svc> shows them."),
  Q(3,1,0,"Which kubectl command creates a ClusterIP Service named db on port 5432 without needing an existing Deployment?",
    "kubectl create service clusterip db --tcp=5432:5432",
    ["kubectl expose service db --port=5432","kubectl run db --service --port=5432","kubectl create svc db --type=ClusterIP 5432"],
    "kubectl create service clusterip <name> --tcp=<port>:<targetPort> creates a Service with the selector app=<name>."),

  // ── Domain 4: Storage ──
  Q(4,1,2,"A PersistentVolumeClaim stays Pending. Which is a likely cause?",
    "No PV matches its size, access mode or storageClassName, and nothing can provision one",
    ["The Pod using it has no CPU requests","The PVC is in a different namespace from the PV","The node is cordoned"],
    "Check kubectl describe pvc. Binding needs a compatible PV or a StorageClass that can provision one. PVs are cluster-scoped, so namespace is not the issue."),
  Q(4,1,2,"What does the ReadWriteOnce (RWO) access mode mean?",
    "The volume can be mounted read-write by a single node at a time",
    ["Only one Pod in the cluster can ever use it","It can be written once and then becomes read-only","Many nodes can mount it read-write"],
    "RWO is per node, so several Pods on the same node can share it. ReadWriteOncePod (RWOP) restricts it to one Pod, and ReadWriteMany allows many nodes."),
  Q(4,1,2,"Which access mode ensures that only one Pod in the whole cluster can use a volume?",
    "ReadWriteOncePod",
    ["ReadWriteOnce","ReadOnlyMany","ReadWriteMany"],
    "ReadWriteOncePod (stable since v1.29, CSI volumes only) is enforced per Pod rather than per node."),
  Q(4,1,2,"A PV with persistentVolumeReclaimPolicy: Retain has its PVC deleted. What happens?",
    "The PV becomes Released and keeps its data; an admin must clean it up before it can be reused",
    ["The PV and its data are deleted immediately","The PV becomes Available for the next claim","The PV is recycled with rm -rf"],
    "Retain protects data. A Released PV is not rebound automatically; you clear its claimRef or recreate it."),
  Q(4,1,2,"Dynamically provisioned volumes use reclaim policy Delete by default. What does that mean?",
    "Deleting the PVC also deletes the PV and the underlying storage",
    ["The PVC cannot be deleted while a Pod runs","The data is moved to a backup bucket","Only the PV object is deleted; the disk remains"],
    "With Delete, removing the claim removes the backing disk too. Use Retain, or patch the PV, for data you must keep."),
  Q(4,1,2,"How is a StorageClass marked as the cluster default?",
    "With the annotation storageclass.kubernetes.io/is-default-class: \"true\"",
    ["By naming it default","With spec.default: true","By creating it in kube-system"],
    "PVCs that omit storageClassName get the default class. Only one class should carry the annotation."),
  Q(4,1,2,"What does volumeBindingMode: WaitForFirstConsumer do?",
    "Delays binding and provisioning until a Pod using the PVC is scheduled",
    ["Waits for an admin to approve the PVC","Binds the PVC immediately to any free PV","Prevents more than one Pod from mounting the volume"],
    "Waiting lets the volume be created in the same zone or node as the Pod. With Immediate, the volume can end up somewhere the Pod cannot run."),
  Q(4,1,2,"You need to grow a PVC from 5Gi to 10Gi. What is required?",
    "Its StorageClass must set allowVolumeExpansion: true; then raise spec.resources.requests.storage",
    ["Delete and recreate the PVC with the new size","Edit the PV's capacity only","Expansion is impossible; create a second PVC"],
    "Supported drivers expand the volume in place. Shrinking a PVC is not supported."),
  Q(4,1,2,"A StatefulSet named web uses volumeClaimTemplates with name data. What storage does each replica get?",
    "Its own PVC, such as data-web-0 and data-web-1, kept even if the StatefulSet scales down",
    ["One shared PVC mounted by all replicas","A temporary emptyDir per replica","A hostPath on each node"],
    "Each ordinal gets a stable PVC, so web-0 always reattaches to data-web-0. PVCs are not deleted on scale-down by default."),
  Q(4,1,2,"Which statement about scope is correct?",
    "PersistentVolumes are cluster-scoped; PersistentVolumeClaims are namespaced",
    ["Both are namespaced","Both are cluster-scoped","PVs are namespaced; PVCs are cluster-scoped"],
    "Admins or provisioners create PVs for the whole cluster. Users claim them through PVCs in their own namespace, and Pods can only use PVCs from their namespace."),
  Q(4,1,2,"You want a PVC to bind to a specific existing PV named pv-logs. Which PVC field does this?",
    "spec.volumeName: pv-logs",
    ["spec.persistentVolume: pv-logs","metadata.labels.pv: pv-logs","spec.claimRef: pv-logs"],
    "volumeName pre-binds the claim, although size, access mode and class must still be compatible. claimRef is the field on the PV side."),
  Q(4,1,2,"How does a Pod mount PVC data-pvc?",
    "Under spec.volumes, add persistentVolumeClaim: {claimName: data-pvc}, then a volumeMount in the container",
    ["Set spec.pvc: data-pvc on the container","Add the annotation volume=data-pvc","Reference the PV name directly in volumeMounts"],
    "The volume entry references the claim by name; volumeMounts in the container then choose the mount path."),
  Q(4,0,1,"How long does data in an emptyDir volume last?",
    "As long as the Pod exists; it survives container restarts but is deleted when the Pod is removed",
    ["Forever, even after the Pod is deleted","Only until the container first restarts","Until the node reboots, even if the Pod is deleted"],
    "emptyDir is scratch space tied to the Pod's lifetime, and is useful for sharing files between containers in a Pod."),
  Q(4,0,1,"Why is hostPath a poor choice for application data in a multi-node cluster?",
    "Data stays on one node, so a rescheduled Pod on another node will not see it, and it exposes the host filesystem",
    ["hostPath volumes are always read-only","hostPath is deleted every time the container restarts","hostPath requires a StorageClass"],
    "hostPath ties the Pod to a node's disk and is a security risk. Use PVCs backed by real storage instead."),
  Q(4,1,2,"In a PersistentVolume manifest, which field declares the volume's size?",
    "spec.capacity.storage",
    ["spec.resources.requests.storage","spec.size","metadata.annotations.size"],
    "PVs declare capacity.storage; PVCs ask for resources.requests.storage. The claim binds to a PV that is at least as large."),

  // ── Domain 5: Troubleshooting ──
  Q(5,0,1,"A Pod is in CrashLoopBackOff. Which command shows the output of the container run that just crashed?",
    "kubectl logs <pod> --previous",
    ["kubectl logs <pod> --follow","kubectl describe pod <pod> --logs","kubectl get pod <pod> -o yaml"],
    "After a restart, plain kubectl logs shows the new container. --previous (-p) shows the last terminated instance, which is where the error is."),
  Q(5,0,1,"A Pod shows ImagePullBackOff. Which causes should you check?",
    "A wrong image name or tag, or a private registry without valid imagePullSecrets",
    ["Too little CPU on the node","A failing readiness probe","A missing ConfigMap"],
    "kubectl describe pod shows the pull error in Events. Fix the image reference or add registry credentials."),
  Q(5,0,1,"A container restarts with reason OOMKilled and exit code 137. What does that tell you?",
    "It used more memory than its memory limit, so the kernel killed it",
    ["Its liveness probe failed","Its CPU limit was exceeded","Its image could not be pulled"],
    "Exceeding a CPU limit only throttles. Exceeding a memory limit kills the process. Raise the limit or fix the memory use."),
  Q(5,1,4,"A Pod stays Pending with the event \"0/3 nodes are available: 3 Insufficient cpu\". What is the fix?",
    "Lower the Pod's CPU requests or add node capacity",
    ["Raise the Pod's CPU limit","Restart the kube-scheduler","Delete the Pod's Service"],
    "Scheduling uses requests, not current usage. No node has enough unreserved allocatable CPU for this request."),
  Q(5,2,0,"A Pod is Pending with \"node(s) had untolerated taint {dedicated: gpu}\". What resolves it?",
    "Add a matching toleration to the Pod, or remove the taint from a suitable node",
    ["Add a nodeSelector for dedicated=gpu only","Increase the Pod's memory request","Recreate the node's kubelet certificate"],
    "Every candidate node is tainted. Either the Pod tolerates the taint or a node must be untainted."),
  Q(5,1,2,"A Pod is Pending with \"pod has unbound immediate PersistentVolumeClaims\". Where do you look next?",
    "kubectl describe pvc for the claim, to see why it has not bound",
    ["kubectl logs on the Pod","The kube-proxy logs","The Ingress controller logs"],
    "The Pod cannot start until its claim is Bound. The PVC events explain a missing StorageClass, a mismatch or provisioning errors."),
  Q(5,0,0,"Node node01 is NotReady. You SSH to it. What do you check first?",
    "The kubelet service: systemctl status kubelet and journalctl -u kubelet",
    ["The etcd logs on node01","kubectl get pods -A on node01","The Ingress controller configuration"],
    "NotReady usually means the kubelet is stopped, misconfigured or cannot reach the API server. Start it with systemctl start kubelet and enable it so it survives reboots."),
  Q(5,0,0,"The kubelet on a kubeadm node fails to start after a config edit. Which file holds its main configuration?",
    "/var/lib/kubelet/config.yaml",
    ["/etc/kubernetes/manifests/kubelet.yaml","/etc/kubelet/kubelet.conf","~/.kube/config"],
    "The KubeletConfiguration lives in /var/lib/kubelet/config.yaml; extra flags are in /var/lib/kubelet/kubeadm-flags.env and the systemd drop-in. The kubelet is a systemd service, not a static Pod."),
  Q(5,0,0,"kubectl returns \"connection to the server <ip>:6443 was refused\" on a control plane node. How do you investigate?",
    "Use crictl ps -a and crictl logs to inspect the kube-apiserver container, and check its static Pod manifest",
    ["Run kubectl logs kube-apiserver -n kube-system","Restart kube-proxy with kubectl rollout restart","Delete and recreate the default namespace"],
    "With the API server down kubectl cannot help. Go to the runtime directly, then fix the typo or bad flag in /etc/kubernetes/manifests/kube-apiserver.yaml."),
  Q(5,0,0,"New Pods stay Pending with no node assigned and no scheduling events at all. Which component is most likely broken?",
    "kube-scheduler",
    ["kube-proxy","CoreDNS","kube-controller-manager"],
    "If the scheduler were running it would bind the Pod or record a FailedScheduling event. Check the kube-scheduler Pod in kube-system and its manifest."),
  Q(5,0,4,"You scale a Deployment from 2 to 5, but no new Pods are created at all, not even Pending ones. Which component should you check?",
    "kube-controller-manager",
    ["kube-scheduler","kubelet on the worker nodes","etcd's peer port"],
    "The Deployment and ReplicaSet controllers inside kube-controller-manager create Pod objects. Without them, desired and actual counts never reconcile."),
  Q(5,1,0,"kubectl get endpoints web shows <none>, but the web Pods are Running and Ready. What is the most likely cause?",
    "The Service selector does not match the Pods' labels",
    ["The Service type should be NodePort","kube-proxy needs to be restarted","The Pods need a livenessProbe"],
    "Compare kubectl describe svc web (Selector) with kubectl get pods --show-labels. One typo in a label leaves the Service with no backends."),
  Q(5,1,0,"A Service has endpoints, but connecting to it gives \"connection refused\". What should you check?",
    "That targetPort matches the port the container actually listens on",
    ["That the Service selector matches the Pods","That CoreDNS is running","That the namespace has a ResourceQuota"],
    "Endpoints prove the selector works. Traffic is forwarded to targetPort, so if the app listens elsewhere the connection is refused."),
  Q(5,1,3,"Pods are Running but show READY 0/1 and receive no Service traffic. What is happening?",
    "The readiness probe is failing, so the Pods are removed from the Service endpoints",
    ["The liveness probe is restarting them","The image tag is wrong","The node is cordoned"],
    "A failing readiness probe never restarts a container; it only stops traffic. Check the probe path, port and app health in kubectl describe pod."),
  Q(5,1,3,"A slow-starting app keeps being restarted, with \"Liveness probe failed\" in its events. What is the cleanest fix?",
    "Add a startupProbe (or a longer initial delay) so liveness checks only begin once the app has started",
    ["Remove the readiness probe","Set restartPolicy: Never on the Deployment","Raise the CPU limit to the node's capacity"],
    "The liveness probe kills the container before it is ready. A startupProbe holds off liveness checks until startup succeeds."),
  Q(5,1,0,"Pods cannot resolve any Service names. Which checks come first?",
    "Check the CoreDNS Pods in kube-system and confirm the kube-dns Service has endpoints",
    ["Restart every application Pod","Check the Ingress controller logs","Reinstall the Metrics Server"],
    "CoreDNS runs as a Deployment behind the kube-dns Service. Crashing CoreDNS Pods, a broken Corefile or an egress policy blocking port 53 are the usual causes."),
  Q(5,0,1,"Which command lists namespace events with the most recent last?",
    "kubectl get events --sort-by=.metadata.creationTimestamp",
    ["kubectl get events --order=time","kubectl describe events --latest","kubectl logs events --sort"],
    "Events are not sorted by default. Sorting on a timestamp field makes the latest problems easy to spot."),
  Q(5,0,1,"Which command finds the Pods using the most memory across all namespaces?",
    "kubectl top pods -A --sort-by=memory",
    ["kubectl get pods -A --sort-by=memory","kubectl describe nodes --memory","kubectl logs -A --memory"],
    "kubectl top reads current usage from Metrics Server. get pods only knows declared requests, not live usage."),
  Q(5,0,1,"The API server is down, but you need a control plane container's logs. Which tool on the node gives them?",
    "crictl logs <container-id>, after finding it with crictl ps -a",
    ["kubectl logs --offline","docker-compose logs","journalctl -u kube-apiserver on kubeadm"],
    "crictl talks to the CRI runtime directly. Log files also exist under /var/log/pods. On kubeadm the components are containers, not systemd units."),
  Q(5,1,1,"A Pod shows CreateContainerConfigError. What is the most likely cause?",
    "It references a ConfigMap, Secret or key that does not exist",
    ["The image does not exist","The node is out of disk","The Service selector is wrong"],
    "The kubelet cannot build the container's environment or volumes. kubectl describe pod names the missing object or key."),
  Q(5,2,0,"A user gets \"cannot list resource pods in API group \"\" in the namespace dev\". How do you confirm the cause?",
    "kubectl auth can-i list pods -n dev --as=<user>, then review the Roles and RoleBindings in dev",
    ["kubectl logs the API server and restart it","Check the NetworkPolicies in dev","Recreate the user's kubeconfig"],
    "This is an RBAC Forbidden error. The user authenticated fine but lacks a binding granting list on pods in dev."),
  Q(5,0,1,"A distroless container has no shell, so kubectl exec fails. How do you get debugging tools inside the Pod?",
    "kubectl debug -it <pod> --image=busybox --target=<container>",
    ["kubectl exec <pod> -- apt install bash","kubectl attach <pod> --shell","kubectl cp busybox <pod>:/bin/sh"],
    "kubectl debug adds an ephemeral container that can share the target's process namespace, without restarting the Pod."),
  Q(5,0,0,"Pods are being evicted and kubectl describe node shows DiskPressure=True. What is happening?",
    "The kubelet is evicting Pods to reclaim node disk space",
    ["The scheduler is rebalancing the cluster","etcd is out of memory","kube-proxy is rotating its rules"],
    "Node-pressure eviction protects the node when disk or memory crosses thresholds. Free disk space (images, logs) to clear the condition."),
  Q(5,0,3,"Which command prints the node each Pod runs on, using JSONPath?",
    "kubectl get pods -o jsonpath='{.items[*].spec.nodeName}'",
    ["kubectl get pods -o jsonpath='{.spec.nodeName}'","kubectl get pods --jsonpath=nodeName","kubectl get pods -o nodeName"],
    "A list response wraps objects in .items, so you iterate with [*]. -o wide shows the same information visually."),
  Q(5,0,3,"Which command shows just Pod names and their phase as two columns?",
    "kubectl get pods -o custom-columns=NAME:.metadata.name,STATUS:.status.phase",
    ["kubectl get pods --columns=name,phase","kubectl get pods -o table=name,status","kubectl describe pods --short"],
    "custom-columns takes HEADER:jsonpath pairs separated by commas. Exam tasks often ask you to save output like this to a file."),
  Q(5,0,0,"A newly joined worker stays NotReady with \"network plugin not ready: cni config uninitialized\". What is wrong?",
    "The CNI plugin is not installed or configured correctly on that node",
    ["The node's kubelet certificate expired","The scheduler cannot reach the node","CoreDNS is not running on the node"],
    "The kubelet needs a CNI config in /etc/cni/net.d and the plugin binaries. Usually the CNI DaemonSet Pod on that node is failing."),
  Q(5,1,4,"A Deployment's Pods are rejected with \"must specify limits.cpu\" in a namespace. Why?",
    "A ResourceQuota on limits.cpu requires every Pod to set CPU limits, and no LimitRange supplies defaults",
    ["The node has no CPU left","HPA is disabled","The namespace is being deleted"],
    "When a quota tracks a resource, Pods must declare it. Add limits to the Pod spec or a LimitRange with defaults."),
  Q(5,0,4,"kubectl rollout status is stuck and the new Pods show ImagePullBackOff. What is the fastest way to restore service?",
    "kubectl rollout undo deployment/<name>",
    ["kubectl delete deployment <name>","kubectl rollout pause deployment/<name>","Scale the Deployment to 0"],
    "With maxUnavailable limiting the rollout, old Pods are still serving. Undo returns to the previous ReplicaSet; then fix the image."),
  Q(5,2,1,"An Ingress returns 503 for a path whose rule looks correct. What should you check?",
    "Whether the backend Service exists and has ready endpoints on the referenced port",
    ["Whether the TLS Secret is of type Opaque","Whether the Ingress is in kube-system","Whether the node is running CoreDNS"],
    "503 from the controller usually means the backend has no healthy Pods. 404 usually means no rule matched the host or path."),
  Q(5,0,0,"Running kubectl on a node prints \"The connection to the server localhost:8080 was refused\". What is the cause?",
    "kubectl has no kubeconfig, so it falls back to localhost:8080",
    ["The API server listens on 8080 and is down","etcd is unhealthy","The kubelet is stopped"],
    "Point kubectl at a kubeconfig: export KUBECONFIG=/etc/kubernetes/admin.conf, or copy it to ~/.kube/config."),
  Q(5,0,0,"Which command follows the kubelet's logs live on a node?",
    "journalctl -u kubelet -f",
    ["kubectl logs kubelet -f","tail -f /etc/kubernetes/kubelet.log","crictl logs kubelet"],
    "The kubelet runs as a systemd service, so its logs are in the journal, not in a container."),
  Q(5,0,0,"On a kubeadm cluster with a working API server, how do you read the kube-scheduler logs?",
    "kubectl logs -n kube-system kube-scheduler-<node-name>",
    ["journalctl -u kube-scheduler","kubectl logs deployment/kube-scheduler","cat /var/log/kube-scheduler.log"],
    "Control plane components run as static Pods named <component>-<node>, so kubectl logs works while the API server is up."),
  Q(5,2,0,"After a NetworkPolicy is applied, frontend Pods can no longer reach api Pods. What do you check first?",
    "Whether the policy's podSelector and from selectors match the actual Pod and namespace labels",
    ["Whether the api Deployment has an HPA","Whether the nodes are tainted","Whether the Service type is LoadBalancer"],
    "Use kubectl get netpol -o yaml together with kubectl get pods --show-labels and kubectl get ns --show-labels. A label mismatch silently blocks traffic."),
  Q(5,0,1,"A container exits immediately with \"exec: not found\" in its events. What is the likely cause?",
    "The command or args in the Pod spec point to a binary that does not exist in the image",
    ["The node is out of memory","The Service has no endpoints","The image registry is unreachable"],
    "The image pulled fine but the entrypoint override is wrong. Check spec.containers[].command and args against what the image contains."),

function K8sLearningContent() {
  const [activePhase, setActivePhase] = useState(0);
  const [activeTab, setActiveTab] = useState("topics");
  const [expandedTopic, setExpandedTopic] = useState(null);
  const [openSolution, setOpenSolution] = useState(null);
  const [showCheatsheet, setShowCheatsheet] = useState(false);
  const [activeCheatTab, setActiveCheatTab] = useState("pods");
  const [mcqAnswers, setMcqAnswers] = useState({});
  const [mcqChecked, setMcqChecked] = useState({});
  const [activeScenario, setActiveScenario] = useState(null);
  const [completedSteps, setCompletedSteps] = useState({});
  const [copiedCmd, setCopiedCmd] = useState(null);
  const [glossaryWord, setGlossaryWord] = useState(null);
  const [showLinks, setShowLinks] = useState(false);

  useEffect(() => { window.scrollTo({top:0, behavior:"instant"}); }, [activeScenario]);
  useEffect(() => {
    if (!glossaryWord) return;
    const close = event => { if (event.key === "Escape") setGlossaryWord(null); };
    document.addEventListener("keydown", close);
    return () => document.removeEventListener("keydown", close);
  }, [glossaryWord]);

  const phase = PHASES[activePhase];
  const phaseId = phase.id;
  const color = phase.color;
  const rgb = phaseRGB[phaseId];
  const font = "'Poppins', sans-serif";
  const mono = "'Fira Code', 'Courier New', monospace";

  const pickAnswer = (qi, oi) => { if (mcqChecked[phaseId]) return; setMcqAnswers(p => ({...p, [`${phaseId}-${qi}`]:oi})); };
  const submitQuiz = () => setMcqChecked(p => ({...p, [phaseId]:true}));
  const retryQuiz = () => {
    setMcqChecked(p => ({...p, [phaseId]:false}));
    setMcqAnswers(p => { const n={...p}; phase.assessment.questions.forEach((_,i) => delete n[`${phaseId}-${i}`]); return n; });
  };
  const quizScore = pid => {
    const qs = PHASES.find(p => p.id===pid).assessment.questions;
    const c = qs.filter((q,i) => mcqAnswers[`${pid}-${i}`]===q.answer).length;
    return {correct:c, total:qs.length, pct:Math.round((c/qs.length)*100)};
  };
  const totalPct = () => {
    const done = PHASES.reduce((s,p) => s+(mcqChecked[p.id] ? quizScore(p.id).correct : 0), 0);
    const total = PHASES.reduce((s,p) => s+p.assessment.questions.length, 0);
    return Math.round((done/total)*100);
  };
  const answeredCount = phase.assessment.questions.filter((_,i) => mcqAnswers[`${phaseId}-${i}`]!==undefined).length;
  const allAnswered = answeredCount===phase.assessment.questions.length;
  const diffColor = d => d==="Easy" ? T.green : d==="Medium" ? T.amber : T.red;
  const toggleStep = (sid,si) => { const k=`${sid}-${si}`; setCompletedSteps(p => ({...p, [k]:!p[k]})); };
  const stepDone = (sid,si) => !!completedSteps[`${sid}-${si}`];
  const scenarioDone = scen => scen.steps.every((_,i) => stepDone(scen.id,i));

  const copyCmd = async (cmd) => {
    try { await navigator.clipboard.writeText(cmd); }
    catch {
      const ta = document.createElement('textarea');
      ta.value=cmd; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }
    setCopiedCmd(cmd);
    setTimeout(() => setCopiedCmd(null), 1500);
  };

  const phaseScenarios = SCENARIOS.filter(s => s.phase===phaseId);

  const renderKeywords = (text, keywords) => {
    if (!keywords?.length) return text;
    const parts=[], sorted=[...keywords].sort((a,b) => b.length-a.length);
    let remaining=text, idx=0;
    while (remaining.length>0) {
      let found=false;
      for (const kw of sorted) {
        if (remaining.indexOf(kw)===0) {
          const def=GLOSSARY[kw];
          parts.push(<span key={idx++} role="button" tabIndex={0} onKeyDown={e => { if (e.key === "Enter" || e.key === " ") {e.preventDefault(); setGlossaryWord(kw);} }} onClick={() => setGlossaryWord(glossaryWord===kw ? null : kw)}
            style={{color, textDecoration:"underline dotted", cursor:"pointer", fontWeight:600}}
            title={def ? def.substring(0,80)+"…" : kw}>{kw}</span>);
          remaining=remaining.slice(kw.length); found=true; break;
        }
      }
      if (!found) {
        let nextIdx=remaining.length;
        for (const kw of sorted) { const i=remaining.indexOf(kw); if (i>0&&i<nextIdx) nextIdx=i; }
        parts.push(<span key={idx++}>{remaining.slice(0,nextIdx)}</span>);
        remaining=remaining.slice(nextIdx);
      }
    }
    return parts;
  };

  const renderExpl = (text, keywords) => text.split('\n').map((line,i) => {
    if (!line.trim()) return <br key={i}/>;
    return <p key={i} style={{margin:"0 0 6px", fontSize:"14px", color:T.textSub, lineHeight:"1.85", whiteSpace:"pre-wrap", wordBreak:"break-word"}}>{renderKeywords(line, keywords)}</p>;
  });

  // ── Mock exam state ──
  const [view, setView] = useState("dashboard");          // "dashboard" | "exam"
  const [exam, setExam] = useState(null);                  // null = menu, else { stage: "running" | "results", ... }
  const [tick, setTick] = useState(0);
  const [modal, setModal] = useState(null);                // null | "submit" | "quit"
  const [reviewFilter, setReviewFilter] = useState("wrong");
  const [history, setHistory] = useState(loadHistory);

  useEffect(() => {
    const fromHash = () => { if (location.hash === "#k8s-exam") { setActiveScenario(null); setView("exam"); } };
    fromHash();
    window.addEventListener("hashchange", fromHash);
    return () => window.removeEventListener("hashchange", fromHash);
  }, []);
  useEffect(() => {
    if (!exam || exam.stage !== "running") return;
    const id = setInterval(() => setTick(t => t + 1), 1000);
    const warn = e => { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", warn);
    return () => { clearInterval(id); window.removeEventListener("beforeunload", warn); };
  }, [exam && exam.stage]);
  useEffect(() => {
    if (exam && exam.stage === "running" && Date.now() >= exam.endAt) finishExam(true);
  }, [tick]);
  useEffect(() => {
    if (!modal) return;
    const close = e => { if (e.key === "Escape") setModal(null); };
    document.addEventListener("keydown", close);
    return () => document.removeEventListener("keydown", close);
  }, [modal]);

  const toTop = () => { try { window.scrollTo({top:0, behavior:"instant"}); } catch (e) {} };
  function openExam() { setView("exam"); toTop(); }
  function closeExam() {
    setView("dashboard");
    if (location.hash === "#k8s-exam") { try { window.history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    toTop();
  }
  function buildQuestions(modeKey, weakKeys) {
    const cfg = EXAM_MODES[modeKey];
    let picked = [];
    if (modeKey === "weak") {
      const inWeak = q => weakKeys.includes(q.p + "-" + q.i);
      picked = shuffle(QUESTION_BANK.filter(inWeak)).slice(0, 15);
      if (picked.length < 8) {
        const filler = shuffle(QUESTION_BANK.filter(q => !inWeak(q))).slice(0, 8 - picked.length);
        picked = picked.concat(filler);
      }
    } else {
      DOMAIN_IDS.forEach(d => {
        const n = cfg.counts[d];
        if (n) picked = picked.concat(shuffle(QUESTION_BANK.filter(q => q.d === d)).slice(0, n));
      });
    }
    return shuffle(picked).map((q, id) => {
      const opts = shuffle([q.right, ...q.wrong]);
      return { ...q, id, opts, ans: opts.indexOf(q.right) };
    });
  }
  function startExam(modeKey, weakKeys) {
    const questions = buildQuestions(modeKey, weakKeys || []);
    const cfg = EXAM_MODES[modeKey];
    const minutes = cfg.minutes || Math.max(10, Math.ceil(questions.length * 1.5));
    const now = Date.now();
    setModal(null);
    setExam({ stage:"running", mode:modeKey, minutes, questions, answers:{}, flags:{}, current:0, startedAt:now, endAt:now + minutes * 60000 });
    toTop();
  }
  function scoreExam(ex, timedOut) {
    const perDomain = {};
    DOMAIN_IDS.forEach(d => { perDomain[d] = { c:0, t:0 }; });
    const perTopic = {};
    let correct = 0;
    ex.questions.forEach((q, idx) => {
      const ok = ex.answers[idx] === q.ans;
      if (ok) correct++;
      perDomain[q.d].t++;
      if (ok) perDomain[q.d].c++;
      const k = q.p + "-" + q.i;
      if (!perTopic[k]) perTopic[k] = { key:k, c:0, t:0, p:q.p, i:q.i, doms:{} };
      perTopic[k].t++;
      perTopic[k].doms[q.d] = true;
      if (ok) perTopic[k].c++;
    });
    const total = ex.questions.length;
    const weak = Object.values(perTopic)
      .filter(v => (v.c / v.t) * 100 < PASS_MARK)
      .sort((a, b) => a.c / a.t - b.c / b.t)
      .map(v => v.key);
    return {
      correct, total, pct:Math.round((correct / total) * 100), perDomain, perTopic, weak, timedOut,
      answered:Object.keys(ex.answers).length,
      timeUsed:Math.max(0, Math.min(Date.now(), ex.endAt) - ex.startedAt),
    };
  }
  function finishExam(timedOut) {
    if (!exam || exam.stage !== "running") return;
    const result = scoreExam(exam, !!timedOut);
    const domPct = {};
    DOMAIN_IDS.forEach(d => { const v = result.perDomain[d]; domPct[d] = v.t ? Math.round((v.c / v.t) * 100) : null; });
    const entry = { t:Date.now(), mode:exam.mode, pct:result.pct, correct:result.correct, total:result.total, domains:domPct, weak:result.weak };
    const next = [entry, ...history].slice(0, 10);
    setHistory(next);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(next)); } catch (e) {}
    setExam({ ...exam, stage:"results", result });
    setReviewFilter(result.correct < result.total ? "wrong" : "all");
    setModal(null);
    toTop();
  }
  function clearHistory() {
    setHistory([]);
    try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
  }
  const pickExamAnswer = (qi, oi) => setExam(ex => ({ ...ex, answers:{ ...ex.answers, [qi]:oi } }));
  const toggleExamFlag = qi => setExam(ex => ({ ...ex, flags:{ ...ex.flags, [qi]:!ex.flags[qi] } }));
  const goExamQuestion = qi => setExam(ex => ({ ...ex, current:Math.max(0, Math.min(ex.questions.length - 1, qi)) }));
  function studyTopic(p, i) {
    closeExam();
    setActivePhase(p);
    setActiveTab("topics");
    setExpandedTopic(i);
    setOpenSolution(null);
  }

  // ── Mock exam views ──
  const backBtn = {background:"transparent", border:"1px solid rgba(255,255,255,0.15)", color:T.textSub, padding:"6px 14px", borderRadius:"8px", cursor:"pointer", fontSize:"13px", fontFamily:font};
  const modeTotal = k => Object.values(EXAM_MODES[k].counts).reduce((a, b) => a + b, 0);
  const topicTitle = (p, i) => PHASES[p].topics[i].title;
  const domBadge = d => (
    <span title={DOMAINS[d].name} style={{background:`rgba(${DOMAINS[d].rgb},0.18)`, color:DOMAINS[d].color, fontSize:"10px", fontWeight:700, letterSpacing:"1px", padding:"3px 9px", borderRadius:"20px", whiteSpace:"nowrap"}}>
      D{d} · {DOMAINS[d].short.toUpperCase()}
    </span>
  );

  function renderExamMenu() {
    const last = history[0];
    const lastWeak = last && last.weak ? last.weak : [];
    const best = history.length ? Math.max(...history.map(h => h.pct)) : null;
    const cardBtn = (mk, onClick, label) => (
      <button onClick={onClick}
        style={{width:"100%", background:`rgba(${EXAM_MODES[mk].rgb},0.16)`, border:`1px solid ${EXAM_MODES[mk].color}`, color:EXAM_MODES[mk].color, padding:"8px 12px", borderRadius:"8px", cursor:"pointer", fontSize:"13px", fontWeight:600, fontFamily:font}}>
        {label}
      </button>
    );
    const modeCard = (k, extra) => {
      const m = EXAM_MODES[k];
      return (
        <div key={k} style={{background:T.card, border:`1px solid rgba(${m.rgb},0.3)`, borderRadius:"14px", overflow:"hidden", display:"flex", flexDirection:"column"}}>
          <div style={{height:"3px", background:m.color}}/>
          <div style={{padding:"16px", display:"flex", flexDirection:"column", flex:1}}>
            <div style={{fontSize:"26px", marginBottom:"6px", color:m.color}}>{m.icon}</div>
            <h3 style={{margin:"0 0 3px", fontSize:"15px", fontWeight:700}}>{m.label}</h3>
            {extra || <div style={{fontSize:"12px", color:m.color, fontWeight:600, marginBottom:"8px"}}>{modeTotal(k)} questions · {m.minutes} min</div>}
            <p style={{margin:"0 0 14px", fontSize:"12px", color:T.textSub, lineHeight:"1.65", flex:1}}>{m.desc}</p>
            {cardBtn(k, () => startExam(k), "▶ Start")}
          </div>
        </div>
      );
    };
    return (
      <div style={{padding:"20px var(--k8s-gutter)", width:"100%", boxSizing:"border-box"}}>
        <button onClick={closeExam} style={backBtn}>← Back to Dashboard</button>
        <div style={{display:"flex", alignItems:"center", gap:"12px", margin:"16px 0 8px", flexWrap:"wrap"}}>
          <div style={{fontSize:"34px"}}>📝</div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{color:T.green, fontSize:"11px", fontWeight:600, letterSpacing:"1.5px"}}>CKA EXAM SIMULATOR</div>
            <h2 style={{margin:"2px 0 0", fontSize:"22px", fontWeight:700}}>Mock Exam Centre</h2>
          </div>
          {best !== null && (
            <div style={{background:"rgba(52,211,153,0.1)", border:"1px solid rgba(52,211,153,0.3)", borderRadius:"12px", padding:"8px 14px", textAlign:"center"}}>
              <div style={{fontSize:"20px", fontWeight:700, color:T.green, lineHeight:1}}>{best}%</div>
              <div style={{fontSize:"10px", color:T.textMute, marginTop:"3px"}}>BEST SCORE</div>
            </div>
          )}
        </div>
        <p style={{margin:"0 0 14px", fontSize:"13px", color:T.textSub, lineHeight:"1.75"}}>
          Test your CKA readiness under exam-like conditions: a countdown timer, no answers shown until you submit, and the option to flag questions for review.
          Afterwards you get your preparedness percentage, a score for each of the five CKA domains, and a ranked list of the lessons to revisit first.
        </p>
        <div style={{display:"flex", gap:"6px", flexWrap:"wrap", marginBottom:"14px"}}>
          {["⏱ Timed", "🙈 No feedback until you submit", "⚖ Weighted like the real CKA", "🔀 Questions and answers shuffled every attempt", `📚 ${QUESTION_BANK.length}-question bank`, `✅ Pass mark ${PASS_MARK}%`].map((c, i) => (
            <span key={i} style={{background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", color:T.textSub, fontSize:"11px", padding:"4px 10px", borderRadius:"20px"}}>{c}</span>
          ))}
        </div>

        <div style={{background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.3)", borderRadius:"12px", padding:"12px 14px", marginBottom:"18px", display:"flex", gap:"10px", alignItems:"flex-start"}}>
          <span style={{fontSize:"18px", flexShrink:0}}>💡</span>
          <p style={{margin:0, fontSize:"12px", color:T.textSub, lineHeight:"1.7"}}>
            <b style={{color:T.amber}}>The real CKA is hands-on.</b> You solve 15-20 tasks in a live terminal in 2 hours. These questions test the knowledge behind those tasks: the commands, file paths and troubleshooting logic.
            Pair them with the Labs and Scenarios tabs, and do the <a href="https://killer.sh/" target="_blank" rel="noopener noreferrer" style={{color:T.amber}}>killer.sh</a> simulator sessions included with your exam registration.

                  {lastWeak.length > 4 ? ` · +${lastWeak.length - 4} more` : ""}

                {cardBtn("weak", () => startExam("weak", lastWeak), "▶ Practise weak areas")}

        <div style={{color:T.textMute, fontSize:"11px", fontWeight:600, letterSpacing:"1px", margin:"20px 0 10px"}}>DOMAIN DRILLS</div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:"12px"}}>
          {DOMAIN_IDS.map(d => modeCard("d" + d, <div style={{fontSize:"12px", color:DOMAINS[d].color, fontWeight:600, marginBottom:"8px"}}>{DOMAINS[d].short} · {DOMAINS[d].weight} · {modeTotal("d" + d)} Qs · {EXAM_MODES["d" + d].minutes} min</div>))}
        </div>

        {history.length > 0 && (
          <div style={{marginTop:"22px"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"8px"}}>

              {history.slice(0, 6).map((h, i) => {

                return (
                  <div key={i} style={{display:"flex", alignItems:"center", gap:"12px", padding:"10px 14px", borderBottom:i < Math.min(history.length, 6) - 1 ? "1px solid rgba(255,255,255,0.06)" : "none", flexWrap:"wrap"}}>

                    <div style={{flex:1, minWidth:"140px"}}>
                      <div style={{fontSize:"13px", fontWeight:600}}>{EXAM_MODES[h.mode] ? EXAM_MODES[h.mode].label : h.mode}</div>

        <p style={{margin:"20px 0 0", fontSize:"11px", color:T.textDim, lineHeight:"1.7"}}>
          These are original practice questions written for this dashboard, not real exam questions. The real CKA pass mark is {PASS_MARK}% and every task is performance-based, so your percentage here is an indicator of readiness, not a prediction.
        </p>
      </div>
    );
  }

  function renderExamRunning() {
    const ex = exam;
    const qs = ex.questions;
    const q = qs[ex.current];
    const remaining = Math.max(0, Math.round((ex.endAt - Date.now()) / 1000));
    const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
    const ss = String(remaining % 60).padStart(2, "0");
    const low = remaining <= 300;
    const answered = qs.reduce((n, _, i) => n + (ex.answers[i] !== undefined ? 1 : 0), 0);
    const flagged = qs.reduce((n, _, i) => n + (ex.flags[i] ? 1 : 0), 0);
    const isLast = ex.current === qs.length - 1;
    const chosen = ex.answers[ex.current];
    const sbtn = (c, filled) => ({background:filled ? `rgba(${c},0.18)` : "transparent", border:`1px solid rgb(${c})`, color:`rgb(${c})`, padding:"7px 14px", borderRadius:"8px", cursor:"pointer", fontSize:"12px", fontWeight:600, fontFamily:font, whiteSpace:"nowrap"});
    return (
      <div>
        <div style={{position:"sticky", top:68, zIndex:20, background:T.surface, borderBottom:"1px solid rgba(255,255,255,0.09)", padding:"10px var(--k8s-gutter)"}}>
          <div style={{display:"flex", alignItems:"center", gap:"10px", flexWrap:"wrap"}}>
            <div style={{flex:1, minWidth:"170px"}}>
              <div style={{fontSize:"10px", color:T.textDim, letterSpacing:"1.5px", fontWeight:600}}>{EXAM_MODES[ex.mode].label.toUpperCase()}</div>
              <div style={{fontSize:"14px", fontWeight:600}}>
                Question {ex.current + 1} of {qs.length} <span style={{color:T.textMute, fontWeight:400, fontSize:"12px"}}>· {answered} answered</span>
              </div>
              <div style={{height:"4px", background:"rgba(255,255,255,0.08)", borderRadius:"2px", marginTop:"6px", overflow:"hidden"}}>
                <div style={{height:"100%", width:`${(answered / qs.length) * 100}%`, background:T.green, transition:"width .2s"}}/>
              </div>
            </div>
            <div role="timer" aria-label="Time remaining" style={{fontFamily:mono, fontSize:"18px", fontWeight:500, color:low ? T.red : T.text, background:low ? "rgba(248,113,113,0.12)" : "rgba(255,255,255,0.06)", border:`1px solid ${low ? "rgba(248,113,113,0.5)" : "rgba(255,255,255,0.12)"}`, padding:"6px 12px", borderRadius:"10px"}}>
              ⏱ {mm}:{ss}
            </div>
            <button onClick={() => setModal("submit")} style={sbtn("52,211,153", true)}>Finish &amp; Submit</button>
            <button onClick={() => setModal("quit")} aria-label="Exit exam" title="Exit exam" style={sbtn("122,143,166", false)}>✕</button>
          </div>
        </div>

        <div style={{padding:"18px var(--k8s-gutter)", width:"100%", boxSizing:"border-box", display:"flex", gap:"16px", flexWrap:"wrap", alignItems:"flex-start"}}>
          <div style={{flex:"3 1 360px", minWidth:0}}>
            <div style={{background:T.card, border:"1px solid rgba(255,255,255,0.09)", borderRadius:"14px", padding:"18px"}}>
              <div style={{display:"flex", gap:"8px", alignItems:"center", marginBottom:"12px", flexWrap:"wrap"}}>
                {domBadge(q.d)}
                <span style={{fontSize:"11px", color:T.textMute}}>Question {ex.current + 1}</span>
                {ex.flags[ex.current] && <span style={{fontSize:"11px", color:T.amber, fontWeight:600}}>⚑ Marked for review</span>}
              </div>
              <div style={{fontSize:"15px", fontWeight:600, lineHeight:"1.7", marginBottom:"14px", wordBreak:"break-word"}}>{q.q}</div>
              <div role="radiogroup" aria-label={`Question ${ex.current + 1} options`} style={{display:"flex", flexDirection:"column", gap:"8px"}}>
                {q.opts.map((opt, oi) => {
                  const sel = chosen === oi;
                  return (
                    <div key={oi} role="radio" aria-checked={sel} tabIndex={0} onClick={() => pickExamAnswer(ex.current, oi)} onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickExamAnswer(ex.current, oi); } }}
                      style={{display:"flex", alignItems:"flex-start", gap:"10px", padding:"11px 14px", borderRadius:"10px", cursor:"pointer", background:sel ? "rgba(34,211,238,0.12)" : "rgba(255,255,255,0.03)", border:`1px solid ${sel ? T.cyan : "rgba(255,255,255,0.1)"}`}}>
                      <div style={{width:"16px", height:"16px", borderRadius:"50%", border:`2px solid ${sel ? T.cyan : "rgba(255,255,255,0.25)"}`, background:sel ? T.cyan : "transparent", flexShrink:0, marginTop:"2px"}}/>
                      <span style={{fontSize:"14px", color:sel ? T.text : T.textSub, lineHeight:"1.6", wordBreak:"break-word"}}>{opt}</span>
